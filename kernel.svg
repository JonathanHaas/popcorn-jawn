<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="kg" cx="38%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#fffde7"/>
      <stop offset="40%"  stop-color="#fff176"/>
      <stop offset="75%"  stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <radialGradient id="kg2" cx="35%" cy="30%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ks">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#b8860b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Main kernel body — irregular lumpy blob -->
  <path filter="url(#ks)" fill="url(#kg)" stroke="#c8940a" stroke-width="1.5" stroke-linejoin="round"
    d="
      M 50,12
      C 62,4  78,10  76,24
      C 86,26 92,36  86,48
      C 94,56 88,70  76,70
      C 76,80 66,88  54,84
      C 50,94 36,94  30,84
      C 18,86  8,76  12,64
      C  4,56  6,42  16,36
      C 10,24  18,10  32,12
      C 34, 4  46, 4  50,12
      Z
    "
  />

  <!-- Lobe highlight — top left -->
  <path fill="url(#kg2)"
    d="M 50,12 C 62,4 78,10 76,24 C 60,18 44,16 50,12 Z"
  />

  <!-- Inner crease lines for texture -->
  <path fill="none" stroke="#e6a817" stroke-width="1" stroke-linecap="round" opacity="0.6"
    d="M 42,30 Q 50,48 44,66"/>
  <path fill="none" stroke="#e6a817" stroke-width="0.8" stroke-linecap="round" opacity="0.5"
    d="M 56,26 Q 62,44 56,62"/>

  <!-- Specular glint -->
  <ellipse cx="36" cy="28" rx="9" ry="6" fill="white" opacity="0.45" transform="rotate(-25,36,28)"/>
  <ellipse cx="32" cy="25" rx="4" ry="2.5" fill="white" opacity="0.6" transform="rotate(-25,32,25)"/>
</svg>
