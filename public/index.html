<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popcorn Jawn</title>
  <meta property="og:title" content="Popcorn Jawn">
  <meta property="og:description" content="Fresh downloads, ready to watch">
  <meta property="og:image" content="https://popcorn.jawnhaas.xyz/og.png?v=5">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:url" content="https://popcorn.jawnhaas.xyz">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://popcorn.jawnhaas.xyz/og.png?v=5">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { overflow-x: hidden; }
    body { background-color: #C8102E; }

    .stripe-border {
      background: repeating-linear-gradient(
        180deg,
        #C8102E 0px, #C8102E 18px,
        #ffffff 18px, #ffffff 36px
      );
    }

    .popcorn-box {
      background: #ffffff;
      border-radius: 0 0 14px 14px;
      border: 3px solid #8B0000;
      border-top: none;
      clip-path: polygon(5% 0%, 95% 0%, 100% 100%, 0% 100%);
    }

    .slab { font-family: 'Alfa Slab One', serif; }

    .card {
      background: #ffffff;
      border-radius: 14px;
      border: 3px solid #8B0000;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card { position: relative; }
    .card-panel {
      background: #111;
      border-top: 1px solid #2a2a2a;
    }
    .card--compact .card-panel {
      max-height: 0;
      overflow: hidden;
      border-top: none;
      transition: max-height 0.32s ease, border-top 0s 0.32s;
    }
    .card--compact:hover .card-panel,
    .card--compact.is-expanded .card-panel {
      max-height: 420px;
      border-top: 1px solid #2a2a2a;
      transition: max-height 0.32s ease;
    }
    .cd-backdrop-wrap {
      width: 100%; height: 130px; overflow: hidden; flex-shrink: 0;
      background: #1a1a1a;
    }
    @keyframes cd-shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .cd-backdrop-wrap.loading {
      background: linear-gradient(90deg, #1a1a1a 25%, #252525 50%, #1a1a1a 75%);
      background-size: 800px 100%;
      animation: cd-shimmer 1.4s infinite linear;
    }
    .cd-backdrop {
      width: 100%; height: 130px;
      object-fit: cover; display: block;
    }
    .cd-backdrop-fallback {
      width: 100%; height: 130px;
      background: linear-gradient(135deg, #8B0000, #C8102E);
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    .cd-body { padding: 10px 14px 14px; }
    .cd-tagline { font-size: 11px; color: #aaa; font-style: italic; margin-bottom: 6px; }
    .cd-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .cd-pill {
      font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: #2a2a2a; color: #ccc; font-weight: 600;
    }
    .cd-genre { background: #1e1e1e; color: #888; font-weight: 400; }
    .cd-overview { font-size: 12px; color: #bbb; line-height: 1.55; margin: 0; }

    .card-pending {
      opacity: 0.55;
      filter: grayscale(0.4);
      border-color: #aaa;
    }
    .card-pending .card-accent {
      background: repeating-linear-gradient(
        90deg, #aaa 0px, #aaa 10px, #fff 10px, #fff 20px
      );
    }

    #req-results:not(:empty) {
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border: 2px solid #8B0000;
      border-radius: 10px;
      overflow: hidden;
      box-sizing: border-box;
    }
    #req-results .card { border: none; border-bottom: 1px solid #f0e0e0; border-radius: 0; overflow: hidden; }
    #req-results .card:first-child { border-radius: 8px 8px 0 0; }
    #req-results .card:last-child  { border-radius: 0 0 8px 8px; border-bottom: none; }
    #req-results .card:only-child  { border-radius: 8px; border-bottom: none; }
    #req-results .card .card-accent { display: none; }

    .card-accent {
      background: repeating-linear-gradient(
        90deg,
        #C8102E 0px, #C8102E 10px,
        #ffffff 10px, #ffffff 20px
      );
      height: 8px;
    }

    .rent-btn {
      background: #C8102E;
      color: #ffffff;
      font-family: 'Alfa Slab One', serif;
      border-radius: 8px;
      letter-spacing: 0.04em;
      transition: background 0.15s;
    }
    .rent-btn:hover { background: #8B0000; }

    @keyframes popcorn-pop {
      0%, 75%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      78%  { transform: translateY(-14px) scale(1.3) rotate(-8deg); }
      83%  { transform: translateY(4px)  scale(0.92) rotate(4deg); }
      88%  { transform: translateY(-6px) scale(1.1) rotate(-3deg); }
      93%  { transform: translateY(2px)  scale(0.97) rotate(1deg); }
    }
    .popcorn-pop {
      display: inline-block;
      animation: popcorn-pop 3s ease-in-out infinite;
      transform-origin: center bottom;
    }
    .popcorn-wrap {
      position: relative;
      display: inline-block;
    }
    @keyframes kernel-fly {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.6) rotate(0deg); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--kx)), calc(-50% + var(--ky))) scale(1) rotate(var(--kr)); }
    }
    .kernel-particle {
      position: absolute;
      left: 50%; top: 30%;
      width: 9px; height: 11px;
      border-radius: 50% 50% 40% 40% / 55% 55% 45% 45%;
      background: radial-gradient(ellipse at 35% 30%, #fffde7, #ffe082 70%, #ffc107);
      border: 1px solid #c8940a;
      pointer-events: none;
      animation: kernel-fly var(--kd) cubic-bezier(0.2, 0.8, 0.6, 1) forwards;
    }

    .kernel {
      display: inline-block;
      width: 8px; height: 8px;
      background: #FFD200;
      border-radius: 50%;
      margin: 0 2px;
    }

    .kern-o {
      display: inline-block;
      width: 0.52em;
      height: 0.64em;
      background: #FFD200;
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      border: 2.5px solid #c8940a;
      vertical-align: -0.04em;
      margin: 0 0.03em;
      box-shadow: inset 0 -2px 3px rgba(0,0,0,0.12);
    }

    .big-kernel {
      display: inline-block;
      width: 0.85em;
      height: 1em;
      background: radial-gradient(ellipse at 38% 38%, #fffde7, #ffe082 60%, #ffc107);
      border-radius: 42% 58% 38% 62% / 52% 44% 56% 48%;
      border: 2.5px solid #c8940a;
      vertical-align: -0.12em;
      margin-left: 0.12em;
      box-shadow:
        inset -2px -2px 5px rgba(0,0,0,0.10),
        inset 2px 2px 4px rgba(255,255,255,0.55);
      position: relative;
    }
    .big-kernel::before {
      content: '';
      position: absolute;
      top: 12%; left: 14%;
      width: 28%; height: 22%;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      transform: rotate(-20deg);
    }
  </style>
</head>
<body class="min-h-screen" style="font-family: 'Inter', sans-serif;">

  <!-- Menu overlay -->
  <div id="menu-overlay" onclick="closeMenu()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;"></div>

  <!-- Activity drawer -->
  <div id="menu-drawer" style="display:none;position:fixed;right:0;top:0;bottom:0;width:min(340px,100vw);background:#fff;z-index:201;overflow-y:auto;box-shadow:-6px 0 32px rgba(0,0,0,0.25);transition:transform 0.2s;">
    <div style="background:#C8102E;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1;">
      <span class="slab" style="color:#fff;font-size:1.1rem;">Activity</span>
      <button onclick="closeMenu()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1;padding:0 4px;">×</button>
    </div>
    <div style="padding:18px 20px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8B0000;margin-bottom:12px;">📥 Downloads</div>
      <div id="menu-dl">Loading…</div>
    </div>
    <div style="border-top:2px solid #FFF0F0;padding:18px 20px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8B0000;margin-bottom:12px;">📺 TV Episodes</div>
      <div id="menu-tv"></div>
    </div>
    <div style="border-top:2px solid #FFF0F0;padding:18px 20px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8B0000;margin-bottom:12px;">📤 Now Sharing</div>
      <div id="menu-ul"></div>
    </div>
  </div>

  <!-- Header stripe top -->
  <div class="stripe-border h-10"></div>

  <!-- Header box -->
  <div style="background:#ffffff;position:relative;" class="px-6 py-6 text-center">
    <button onclick="toggleMenu()" id="menu-btn" title="Activity" style="position:absolute;top:18px;right:18px;background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:5px;">
      <span style="display:block;width:22px;height:2px;background:#C8102E;border-radius:2px;"></span>
      <span style="display:block;width:22px;height:2px;background:#C8102E;border-radius:2px;"></span>
      <span style="display:block;width:22px;height:2px;background:#C8102E;border-radius:2px;"></span>
    </button>
    <div class="text-5xl mb-1">
      <span class="popcorn-wrap" id="popcorn-wrap">
        <span class="popcorn-pop">🍿</span>
      </span>
    </div>
    <h1 class="slab text-4xl tracking-tight" style="color:#C8102E;">Popcorn Jawn</h1>
    <div class="flex items-center justify-center gap-2 mt-1">
      <span class="kernel"></span>
      <span class="text-xs font-semibold tracking-widest uppercase" style="color:#8B0000;">Now Showing · Fresh Downloads · Made with ❤️ in Philadelphia</span>
      <span class="kernel"></span>
    </div>
  </div>

  <!-- Header stripe bottom -->
  <div style="height:2px; background:#8B0000;"></div>

  <!-- Request section -->
  <div class="max-w-2xl mx-auto px-4 pt-6 pb-2" style="position:relative;">
    <div class="flex items-center gap-3 mb-3">
      <span class="kernel"></span>
      <span class="text-xs font-bold tracking-widest uppercase" style="color:#ffffff;">Request Something</span>
      <span class="kernel"></span>
    </div>
    <div class="flex gap-2">
      <input type="text" id="req-input" placeholder="Title, description, vibe…"
             class="flex-1 px-4 py-2 rounded-lg text-sm"
             style="border:2px solid #8B0000; outline:none; font-family:'Inter',sans-serif; font-size:16px;"
             oninput="debouncedSearch()"
             onkeydown="if(event.key==='Enter') searchMovies()"
             onblur="setTimeout(()=>{ document.getElementById('req-results').innerHTML=''; },200)">
      <button onclick="searchMovies()" class="rent-btn px-4 py-2 text-sm">Search</button>
    </div>
    <div id="req-results" style="position:absolute; left:1rem; right:1rem; top:100%; z-index:100; display:flex; flex-direction:column; gap:0; border-radius:10px; padding:0;"></div>
  </div>

  <!-- Content -->
  <div class="max-w-2xl mx-auto px-4 py-8">

    <div id="season-picker" class="mb-4"></div>
    <div id="pending" class="space-y-4 mb-4"></div>
    <div id="shares" class="space-y-4"></div>
    <div id="empty" class="hidden text-center py-16">
      <div class="text-4xl mb-3">🎞️</div>
      <p class="slab text-xl" style="color:#ffffff;">No showings tonight</p>
      <p class="text-sm mt-1" style="color:#ffaaaa;">Check back soon</p>
    </div>

    <!-- Expired -->
    <div id="history-section" class="mt-10 hidden">
      <div class="flex items-center gap-3 mb-4">
        <span class="kernel"></span>
        <span class="text-xs font-bold tracking-widest uppercase" style="color:#ffaaaa;">Past Showings</span>
        <span class="kernel"></span>
      </div>
      <div id="history"></div>
    </div>
  </div>

  <!-- Footer band -->
  <div style="background:#ffffff; border-top:2px solid #8B0000; border-bottom:2px solid #8B0000;" class="text-center py-3">
    <span style="font-family:'Alfa Slab One',serif; font-size:1.1rem; color:#009A44; letter-spacing:0.06em;">🦅 Go Birds!</span>
  </div>

  <script>
    // Touch tap to expand compact search cards on mobile
    document.addEventListener('click', function(e) {
      const card = e.target.closest('.card--compact');
      if (!card) return;
      if (e.target.closest('button, a')) return;
      card.classList.toggle('is-expanded');
    });

    function daysUntil(iso) {
      return Math.ceil((new Date(iso) - new Date()) / 86400000);
    }

    function expiryBadge(iso) {
      const d = daysUntil(iso);
      if (d <= 0) return '<span class="text-xs font-bold" style="color:#ef4444;">Expired</span>';
      if (d <= 2) return `<span class="text-xs font-bold" style="color:#ef4444;">⚠ ${d}d left</span>`;
      if (d <= 5) return `<span class="text-xs font-bold" style="color:#d97706;">${d} days left</span>`;
      return `<span class="text-xs font-semibold" style="color:#16a34a;">${d} days left</span>`;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function posterImg(path, size) {
      return path
        ? `<img src="https://image.tmdb.org/t/p/w92${path}" class="${size} object-cover rounded flex-shrink-0" style="border:1px solid #d1d5db;" loading="lazy">`
        : `<div class="${size} flex-shrink-0 rounded flex items-center justify-center text-xl" style="background:#FFF0F0; border:1px solid #C8102E;">🎬</div>`;
    }

    function activeCard(s) {
      return `
        <div class="card" ${s.tmdbId ? `data-result-id="${s.tmdbId}" data-type="movie"` : ''}>
          <div class="card-accent"></div>
          <div class="p-4 flex items-center gap-4">
            ${posterImg(s.posterPath, 'w-12 h-16')}
            <div class="flex-1 min-w-0">
              <div class="slab text-lg leading-tight" style="color:#1a1a1a;">${s.title}</div>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                <span class="text-xs font-semibold px-1.5 py-0.5 rounded-full" style="background:#FFF0F0;color:#C8102E;">${s.year}</span>
                <span class="rating-slot text-xs" style="color:#aaa;">…</span>
              </div>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                <span class="text-xs" style="color:#666;">${s.size_human}</span>
                <span class="text-xs" style="color:#bbb;">·</span>
                <span class="text-xs" style="color:#666;">Added ${formatDate(s.created)}</span>
                <span class="text-xs" style="color:#bbb;">·</span>
                ${expiryBadge(s.expires)}
              </div>
            </div>
            <a href="${s.gofile_link}" target="_blank" class="rent-btn flex-shrink-0 text-sm px-4 py-2 no-underline">
              Get It
            </a>
          </div>
          ${s.tmdbId ? `<div class="card-panel"><div class="cd-backdrop-wrap loading"></div><div class="cd-body"></div></div>` : ''}
        </div>`;
    }

    function expiredRow(s) {
      return `
        <div class="flex items-center py-2 border-b" style="border-color:#ffaaaa33;">
          <span class="text-sm font-semibold" style="color:#ffaaaa;">${s.title} <span style="font-weight:400;">(${s.year})</span></span>
          <span class="ml-auto text-xs" style="color:#ff666680;">Expired ${formatDate(s.expires)}</span>
        </div>`;
    }

    function getPending() {
      try { return JSON.parse(localStorage.getItem('popcorn_pending') || '[]'); } catch { return []; }
    }
    function savePending(list) {
      localStorage.setItem('popcorn_pending', JSON.stringify(list));
    }
    function dismissPending(id) {
      savePending(getPending().filter(p => String(p.id) !== String(id)));
      document.querySelector(`[data-pending-id="${id}"]`)?.remove();
    }

    function renderPendingCards(activeShares) {
      const activeTmdbIds = new Set((activeShares||[]).map(s => String(s.tmdbId)));
      let pending = getPending().filter(p => !activeTmdbIds.has(String(p.id)));
      savePending(pending);
      const el = document.getElementById('pending');
      el.innerHTML = pending.map(p => `
        <div class="card card-pending" data-pending-id="${p.id}">
          <div class="card-accent"></div>
          <div class="p-4 flex items-center gap-4">
            ${posterImg(p.posterPath, 'w-12 h-16')}
            <div class="flex-1 min-w-0">
              <div class="slab text-lg leading-tight" style="color:#555;">${p.title}</div>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                ${p.year ? `<span class="text-xs font-semibold px-1.5 py-0.5 rounded-full" style="background:#f0f0f0;color:#888;">${p.year}</span>` : ''}
                <span class="text-xs font-semibold" style="color:#999;">⏳ Requested${p.seasonLabel ? ' · ' + p.seasonLabel : ''} — waiting for download</span>
              </div>
            </div>
            <button onclick="dismissPending(${p.id})" title="Dismiss" style="color:#bbb;font-size:1.2rem;line-height:1;background:none;border:none;cursor:pointer;padding:4px 8px;" onmouseover="this.style.color='#888'" onmouseout="this.style.color='#bbb'">×</button>
          </div>
        </div>`).join('');
    }

    async function load() {
      try {
        const data = await fetch('shares.json?t=' + Date.now()).then(r => r.json());
        const shares = data.shares || [];
        const active = shares.filter(s => daysUntil(s.expires) > 0).reverse();
        _activeShares = active;
        const expired = shares.filter(s => daysUntil(s.expires) <= 0).reverse();

        renderPendingCards(active);

        if (active.length === 0) {
          document.getElementById('empty').classList.remove('hidden');
        } else {
          document.getElementById('shares').innerHTML = active.map(activeCard).join('');
          fetchRatings(active.filter(s => s.tmdbId).map(s => ({id: s.tmdbId, mediaType: 'movie'})), document.getElementById('shares'));
        }
        if (expired.length > 0) {
          document.getElementById('history-section').classList.remove('hidden');
          document.getElementById('history').innerHTML = expired.map(expiredRow).join('');
        }
      } catch {
        document.getElementById('shares').innerHTML = '<p class="text-sm font-bold" style="color:#ffaaaa;">Failed to load shares.</p>';
      }
    }

    load();

    // Popcorn kernel burst
    const wrap = document.getElementById('popcorn-wrap');
    function spawnKernels() {
      const count = 5 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const k = document.createElement('span');
          k.className = 'kernel-particle';
          const angle = (Math.random() * 160 - 80) * Math.PI / 180;
          const dist = 45 + Math.random() * 45;
          k.style.setProperty('--kx', (Math.sin(angle) * dist) + 'px');
          k.style.setProperty('--ky', (-Math.cos(angle) * dist - 20) + 'px');
          k.style.setProperty('--kr', (Math.random() * 360 - 180) + 'deg');
          k.style.setProperty('--kd', (0.6 + Math.random() * 0.4) + 's');
          wrap.appendChild(k);
          setTimeout(() => k.remove(), 1100);
        }, i * 40);
      }
    }
    // Fire at 78% of the 3s animation cycle = 2340ms, then every 3s
    setTimeout(() => { spawnKernels(); setInterval(spawnKernels, 3000); }, 2340);

    // --- Movie request ---
    let searchTimer = null;
    function debouncedSearch() {
      clearTimeout(searchTimer);
      const q = document.getElementById('req-input').value.trim();
      if (q.length < 2) { document.getElementById('req-results').innerHTML = ''; return; }
      searchTimer = setTimeout(searchMovies, 350);
    }

    const STATUS_LABEL = {
      0: null,
      1: ['Unknown', '#999'],
      2: ['Pending', '#d97706'],
      3: ['Downloading', '#2563eb'],
      4: ['Partly Available', '#16a34a'],
      5: ['Available', '#16a34a'],
    };

    async function searchMovies() {
      const q = document.getElementById('req-input').value.trim();
      if (!q) return;
      const box = document.getElementById('req-results');
      box.innerHTML = '<p class="text-sm" style="color:#ffcccc;">Searching…</p>';
      try {
        const data = await fetch('/arr-control/seerr/search?q=' + encodeURIComponent(q)).then(r => r.json());
        if (!data.ok || !data.results.length) {
          box.innerHTML = '<p class="text-sm" style="color:#ffcccc;">No results found.</p>';
          return;
        }
        box.innerHTML = data.results.map(r => {
          const sl = STATUS_LABEL[r.status];
          const badge = sl
            ? `<span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:#fff4; color:${sl[1]};">${sl[0]}</span>`
            : '';
          const btn = (r.status === 5 || r.status === 4)
            ? `<span class="text-xs font-semibold px-3 py-1.5 rounded-lg" style="background:#16a34a20; color:#16a34a;">In Library</span>`
            : r.mediaType === 'tv'
              ? `<button onclick="showSeasons(${r.id},this)" class="rent-btn flex-shrink-0 text-xs px-3 py-1.5">📺 Seasons</button>`
              : `<button onclick="requestMovie(${r.id},'${r.mediaType}',this)" class="rent-btn flex-shrink-0 text-xs px-3 py-1.5">+ Request</button>`;
          return `
            <div class="card card--compact" data-result-id="${r.id}" data-type="${r.mediaType}">
              <div class="card-accent"></div>
              <div class="p-4 flex items-center gap-4">
                ${posterImg(r.posterPath, 'w-12 h-16')}
                <div class="flex-1 min-w-0">
                  <div class="slab text-base leading-tight truncate" style="color:#1a1a1a;">${r.title}</div>
                  <div class="flex items-center flex-wrap gap-2 mt-0.5">
                    ${r.year ? `<span class="text-xs font-semibold px-1.5 py-0.5 rounded-full" style="background:#FFF0F0;color:#C8102E;">${r.year}</span>` : ''}
                    <span class="text-xs capitalize" style="color:#888;">${r.mediaType}</span>
                    ${badge}
                    <span class="rating-slot text-xs" style="color:#aaa;">…</span>
                  </div>
                </div>
                ${btn}
              </div>
              <div class="card-panel"><div class="cd-backdrop-wrap loading"></div><div class="cd-body"></div></div>
            </div>`;
        }).join('');
        fetchRatings(data.results, document.getElementById('req-results'));
      } catch {
        box.innerHTML = '<p class="text-sm" style="color:#ffcccc;">Search failed.</p>';
      }
    }

    async function fetchRatings(items, scope = document) {
      await Promise.all(items.map(async item => {
        const id = item.id || item.tmdbId;
        const type = item.mediaType || 'movie';
        if (!id) return;
        const card = scope.querySelector(`[data-result-id="${id}"]`);
        if (!card) return;
        const slot = card.querySelector('.rating-slot');
        if (!slot) return;
        try {
          const d = await fetch(`/arr-control/seerr/details?id=${id}&type=${type}`).then(x => x.json());
          if (!d.ok) { slot.textContent = ''; return; }
          // Fill pre-rendered panel skeleton (space already reserved, no layout shift)
          let panel = card.querySelector('.card-panel');
          if (!panel) { panel = document.createElement('div'); panel.className = 'card-panel'; card.appendChild(panel); }
          let metaHtml = '';
          if (d.runtime) metaHtml += `<span class="cd-pill">${d.runtime}m</span>`;
          if (d.rtScore) {
            const p = parseInt(d.rtScore);
            metaHtml += `<span class="cd-pill" style="color:${p>=60?'#ef4444':'#888'}">${p>=60?'🍅':'🤢'} ${d.rtScore}</span>`;
          }
          if (d.imdbScore) metaHtml += `<span class="cd-pill" style="color:#f5c518">★ ${d.imdbScore}</span>`;
          (d.genres||[]).forEach(g => { metaHtml += `<span class="cd-pill cd-genre">${g}</span>`; });
          const overview = (d.overview||'').length > 280 ? d.overview.slice(0,280)+'…' : (d.overview||'');
          const wrap = panel.querySelector('.cd-backdrop-wrap');
          if (wrap) {
            wrap.classList.remove('loading');
            wrap.innerHTML = d.backdropPath
              ? `<img class="cd-backdrop" src="https://image.tmdb.org/t/p/w780${d.backdropPath}" loading="eager">`
              : `<div class="cd-backdrop-fallback">🎬</div>`;
          } else {
            panel.innerHTML = `<div class="cd-backdrop-wrap">${d.backdropPath
              ? `<img class="cd-backdrop" src="https://image.tmdb.org/t/p/w780${d.backdropPath}" loading="eager">`
              : `<div class="cd-backdrop-fallback">🎬</div>`}</div>`;
          }
          const body = panel.querySelector('.cd-body') || (() => { const b = document.createElement('div'); b.className = 'cd-body'; panel.appendChild(b); return b; })();
          body.innerHTML = `${d.tagline ? `<div class="cd-tagline">${d.tagline}</div>` : ''}
            ${metaHtml ? `<div class="cd-meta">${metaHtml}</div>` : ''}
            ${overview ? `<p class="cd-overview">${overview}</p>` : ''}`;
          let html = '';
          if (d.rtScore) {
            const pct = parseInt(d.rtScore);
            const tomato = pct >= 60 ? '🍅' : '🤢';
            html += `<span style="color:${pct>=60?'#C8102E':'#888'}; font-weight:600;">${tomato} ${d.rtScore}</span>`;
          }
          if (d.imdbScore) {
            html += `${html ? ' · ' : ''}<span style="color:#f5c518; font-weight:600;">IMDb ${d.imdbScore}</span>`;
          }
          if (!html && d.voteAverage) {
            html = `<span style="color:#f59e0b; font-weight:600;">⭐ ${d.voteAverage.toFixed(1)}</span>`;
          }
          slot.innerHTML = html || '';
        } catch { slot.textContent = ''; }
      }));
    }

    let _spData = null;

    async function showSeasons(id, btn) {
      const card = btn.closest('.card');
      _spData = {
        id,
        title: card.querySelector('.slab')?.textContent?.trim() || '',
        year: card.querySelector('[style*="FFF0F0"]')?.textContent?.trim() || '',
        posterPath: card.querySelector('img')?.src?.match(/w92(.+)$/)?.[1] || null,
      };
      document.getElementById('req-results').innerHTML = '';
      document.getElementById('req-input').value = '';

      const picker = document.getElementById('season-picker');
      picker.innerHTML = `
        <div class="card" style="border-color:#333;background:#111;">
          <div class="card-accent" style="background:repeating-linear-gradient(90deg,#333 0,#333 10px,#1a1a1a 10px,#1a1a1a 20px);"></div>
          <div class="p-4 flex items-center gap-4">
            ${posterImg(_spData.posterPath, 'w-12 h-16')}
            <div class="flex-1 min-w-0">
              <div class="slab text-lg leading-tight" style="color:#eee;">${_spData.title}</div>
              ${_spData.year ? `<span class="text-xs font-semibold px-1.5 py-0.5 rounded-full mt-1 inline-block" style="background:#222;color:#888;">${_spData.year}</span>` : ''}
            </div>
            <button onclick="clearSeasonPicker()" style="color:#555;font-size:1.3rem;line-height:1;background:none;border:none;cursor:pointer;padding:4px 8px;" onmouseover="this.style.color='#aaa'" onmouseout="this.style.color='#555'">×</button>
          </div>
          <div class="sp-body" style="padding:0 16px 16px;">
            <p style="color:#666;font-size:12px;">Loading…</p>
          </div>
        </div>`;

      const body = picker.querySelector('.sp-body');
      try {
        const d = await fetch(`/arr-control/seerr/seasons?id=${id}`).then(r => r.json());
        if (!d.ok || !d.seasons.length) {
          body.innerHTML = '<p style="color:#f87171;font-size:12px;">Could not load seasons.</p>'; return;
        }
        body.innerHTML = `
          <div class="sp-seasons" style="margin-bottom:12px;">
            ${d.seasons.map(s => `
              <div class="sp-season" data-season="${s.number}" style="border-bottom:1px solid #1e1e1e;">
                <div style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;" onclick="spToggleSeason(${s.number},${id},this)">
                  <span class="sp-chev" style="color:#555;font-size:10px;width:12px;text-align:center;">▶</span>
                  <input type="checkbox" class="sp-season-cb" data-season="${s.number}" style="accent-color:#C8102E;width:15px;height:15px;flex-shrink:0;" checked onclick="event.stopPropagation();spSeasonCheck(${s.number},this)">
                  <span style="color:#eee;font-size:13px;font-weight:600;flex:1;">${s.name}</span>
                  <span style="color:#555;font-size:11px;">${s.episodeCount} eps</span>
                </div>
                <div class="sp-eps" style="display:none;padding-bottom:4px;"></div>
              </div>`).join('')}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button onclick="requestTV(this)" class="rent-btn text-xs px-3 py-1.5">Request Selected</button>
          </div>`;
      } catch {
        body.innerHTML = '<p style="color:#f87171;font-size:12px;">Error loading seasons.</p>';
      }
    }

    async function spToggleSeason(seasonNum, tvId, headerEl) {
      const seasonDiv = headerEl.closest('.sp-season');
      const epsDiv = seasonDiv.querySelector('.sp-eps');
      const chev = seasonDiv.querySelector('.sp-chev');
      const open = epsDiv.style.display !== 'none';
      epsDiv.style.display = open ? 'none' : 'block';
      chev.textContent = open ? '▶' : '▼';
      if (open || epsDiv.dataset.loaded) return;
      epsDiv.dataset.loaded = '1';
      epsDiv.innerHTML = '<p style="color:#555;font-size:11px;padding:4px 0 4px 20px;">Loading episodes…</p>';
      try {
        const d = await fetch(`/arr-control/seerr/episodes?id=${tvId}&season=${seasonNum}`).then(r => r.json());
        if (!d.ok || !d.episodes.length) { epsDiv.innerHTML = '<p style="color:#555;font-size:11px;padding-left:20px;">No episodes.</p>'; return; }
        epsDiv.innerHTML = d.episodes.map(ep => `
          <label style="display:flex;align-items:center;gap:8px;padding:3px 0 3px 20px;cursor:pointer;">
            <input type="checkbox" class="sp-ep-cb" data-season="${seasonNum}" data-ep="${ep.number}" style="accent-color:#C8102E;width:13px;height:13px;flex-shrink:0;" checked onchange="spSyncSeasonCb(${seasonNum})">
            <span style="color:#888;font-size:11px;min-width:28px;flex-shrink:0;">E${String(ep.number).padStart(2,'0')}</span>
            <span style="color:#ccc;font-size:12px;">${ep.name}</span>
          </label>`).join('');
      } catch { epsDiv.innerHTML = '<p style="color:#f87171;font-size:11px;padding-left:20px;">Error.</p>'; }
    }

    function spSeasonCheck(seasonNum, cb) {
      const epsDiv = document.querySelector(`.sp-season[data-season="${seasonNum}"] .sp-eps`);
      epsDiv?.querySelectorAll('.sp-ep-cb').forEach(e => e.checked = cb.checked);
    }

    function spSyncSeasonCb(seasonNum) {
      const epBoxes = [...(document.querySelector(`.sp-season[data-season="${seasonNum}"] .sp-eps`)?.querySelectorAll('.sp-ep-cb') || [])];
      if (!epBoxes.length) return;
      const cb = document.querySelector(`.sp-season-cb[data-season="${seasonNum}"]`);
      if (cb) cb.checked = epBoxes.some(e => e.checked);
    }

    function clearSeasonPicker() {
      document.getElementById('season-picker').innerHTML = '';
      _spData = null;
    }

    async function requestTV(btn) {
      if (!_spData) return;
      // Collect seasons: any season whose season-cb is checked (or has ≥1 ep checked)
      const seasonDivs = [...document.querySelectorAll('.sp-season')];
      const seasons = seasonDivs
        .filter(sd => {
          const epBoxes = [...sd.querySelectorAll('.sp-ep-cb')];
          // If episodes loaded, use ep-level; otherwise use season checkbox
          return epBoxes.length ? epBoxes.some(e => e.checked) : sd.querySelector('.sp-season-cb')?.checked;
        })
        .map(sd => +sd.dataset.season);
      if (!seasons.length) {
        btn.textContent = 'Pick something';
        setTimeout(() => btn.textContent = 'Request Selected', 1500);
        return;
      }
      btn.disabled = true; btn.textContent = '…';
      const {id, title, year, posterPath} = _spData;
      const seasonLabel = seasons.length === 1 ? `S${String(seasons[0]).padStart(2,'0')}` : `${seasons.length} seasons`;
      try {
        const res = await fetch('/arr-control/seerr/request', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({mediaId: id, mediaType: 'tv', seasons}),
        });
        if (res.ok) {
          btn.textContent = 'Queued 🍿'; btn.style.background = '#16a34a';
          const pending = getPending().filter(p => String(p.id) !== String(id));
          pending.unshift({id, type: 'tv', title, year, posterPath, seasons, seasonLabel, requestedAt: Date.now()});
          savePending(pending);
          renderPendingCards(null);
          setTimeout(() => clearSeasonPicker(), 1000);
        } else {
          btn.textContent = 'Error'; btn.disabled = false;
        }
      } catch { btn.textContent = 'Error'; btn.disabled = false; }
    }

    // --- Activity drawer ---
    let _menuOpen = false, _menuTimer = null, _activeShares = [];

    function toggleMenu() { _menuOpen ? closeMenu() : openMenu(); }

    function openMenu() {
      _menuOpen = true;
      document.getElementById('menu-overlay').style.display = 'block';
      document.getElementById('menu-drawer').style.display = 'block';
      populateUploads();
      loadMenuDownloads();
      _menuTimer = setInterval(loadMenuDownloads, 12000);
    }

    function closeMenu() {
      _menuOpen = false;
      document.getElementById('menu-overlay').style.display = 'none';
      document.getElementById('menu-drawer').style.display = 'none';
      clearInterval(_menuTimer);
    }

    function populateUploads() {
      const el = document.getElementById('menu-ul');
      if (!_activeShares.length) { el.innerHTML = '<p style="color:#aaa;font-size:12px;">Nothing sharing right now.</p>'; return; }
      el.innerHTML = _activeShares.map(s => `
        <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #FFF0F0;">
          ${s.posterPath ? `<img src="https://image.tmdb.org/t/p/w92${s.posterPath}" style="width:28px;height:38px;object-fit:cover;border-radius:3px;flex-shrink:0;">` : '<div style="width:28px;height:38px;background:#FFF0F0;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">🎬</div>'}
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.title}</div>
            <div style="font-size:11px;color:#888;">${s.year} · ${s.size_human} · ${expiryBadge(s.expires).replace(/<[^>]+>/g,'')}</div>
          </div>
        </div>`).join('');
    }

    async function loadMenuDownloads() {
      const el = document.getElementById('menu-dl');
      try {
        const d = await fetch('/arr-control/downloads').then(r => r.json());
        if (!d.ok) { el.innerHTML = '<span style="color:#f87171;font-size:12px;">Unavailable</span>'; return; }
        let html = '';
        if (d.paused) html += '<div style="color:#d97706;font-size:12px;font-weight:600;margin-bottom:8px;">⏸ Queue paused</div>';
        else if (d.active.length && d.speed !== '0') html += `<div style="color:#16a34a;font-size:11px;margin-bottom:8px;">↓ ${(+d.speed/1024).toFixed(1)} MB/s</div>`;
        if (!d.active.length) {
          html += '<p style="color:#aaa;font-size:12px;">No active downloads</p>';
        } else {
          html += d.active.map(s => `
            <div style="margin-bottom:12px;">
              <div style="font-size:12px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;" title="${s.name}">${s.name}</div>
              <div style="background:#f0e0e0;border-radius:4px;height:5px;">
                <div style="background:#C8102E;height:5px;border-radius:4px;width:${s.pct}%;transition:width .5s;"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:3px;">
                <span>${s.pct}%</span><span>${d.paused ? '—' : s.eta}</span>
              </div>
            </div>`).join('');
        }
        if (d.recent.length) {
          html += '<div style="margin-top:4px;padding-top:12px;border-top:1px solid #f5f5f5;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ccc;margin-bottom:8px;">Recent</div>';
          html += d.recent.map(s => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #fafafa;">
              <span style="font-size:12px;color:#666;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.name}</span>
              <span style="font-size:11px;font-weight:600;flex-shrink:0;margin-left:8px;color:${s.status==='Completed'?'#16a34a':'#aaa'};">${s.status}</span>
            </div>`).join('');
        }
        el.innerHTML = html;

        // TV section
        const tvEl = document.getElementById('menu-tv');
        if (tvEl) {
          let tvHtml = '';
          if (d.tv_queue?.length) {
            tvHtml += '<div style="margin-bottom:10px;">';
            tvHtml += d.tv_queue.map(e => `
              <div style="margin-bottom:10px;">
                <div style="font-size:12px;font-weight:600;color:#333;">${e.show}</div>
                <div style="font-size:11px;color:#888;margin-bottom:3px;">S${String(e.season).padStart(2,'0')}E${String(e.episode).padStart(2,'0')}</div>
                <div style="background:#f0e0e0;border-radius:4px;height:5px;">
                  <div style="background:#C8102E;height:5px;border-radius:4px;width:${e.pct}%;transition:width .5s;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:3px;">
                  <span>${e.pct}%</span><span>${e.eta || ''}</span>
                </div>
              </div>`).join('');
            tvHtml += '</div>';
          }
          if (d.tv_recent?.length) {
            if (d.tv_queue?.length) tvHtml += '<div style="border-top:1px solid #f5f5f5;margin-bottom:8px;padding-top:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ccc;">Recent</div>';
            tvHtml += d.tv_recent.map(e => `
              <div style="display:flex;align-items:baseline;gap:6px;padding:4px 0;border-bottom:1px solid #fafafa;">
                <span style="font-size:12px;font-weight:600;color:#555;flex-shrink:0;">${e.show}</span>
                <span style="font-size:11px;color:#bbb;flex-shrink:0;">S${String(e.season).padStart(2,'0')}E${String(e.episode).padStart(2,'0')}</span>
                <span style="font-size:11px;color:#ddd;margin-left:auto;flex-shrink:0;">${e.date}</span>
              </div>`).join('');
          }
          if (!tvHtml) tvHtml = '<p style="color:#aaa;font-size:12px;">No TV episodes yet.</p>';
          tvEl.innerHTML = tvHtml;
        }
      } catch { el.innerHTML = '<span style="color:#f87171;font-size:12px;">Error</span>'; }
    }

    async function requestMovie(id, type, btn) {
      btn.disabled = true;
      btn.textContent = '…';
      // Grab card info for the pending display
      const card = btn.closest('.card');
      const title = card?.querySelector('.slab')?.textContent?.trim() || '';
      const year = card?.querySelector('[style*="FFF0F0"]')?.textContent?.trim() || '';
      const posterImg = card?.querySelector('img')?.src?.match(/w92(.+)$/)?.[1] || null;
      try {
        const res = await fetch('/arr-control/seerr/request', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({mediaId: id, mediaType: type}),
        });
        if (res.ok) {
          btn.textContent = 'Queued 🍿';
          btn.style.background = '#16a34a';
          // Save to pending list and show greyed-out card in Now Showing
          const pending = getPending().filter(p => String(p.id) !== String(id));
          pending.unshift({id, type, title, year, posterPath: posterImg, requestedAt: Date.now()});
          savePending(pending);
          renderPendingCards(null);
          // Close dropdown
          setTimeout(() => { document.getElementById('req-results').innerHTML = ''; document.getElementById('req-input').value = ''; }, 800);
        } else {
          const d = await res.json();
          btn.textContent = 'Error';
          btn.disabled = false;
          console.error(d);
        }
      } catch {
        btn.textContent = 'Error';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
