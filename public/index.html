<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popcorn Jawn</title>
  <meta property="og:title" content="Popcorn Jawn">
  <meta property="og:description" content="Fresh downloads, ready to watch">
  <meta property="og:image" content="https://popcorn.jawnhaas.xyz/og.png?v=5">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:url" content="https://popcorn.jawnhaas.xyz">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://popcorn.jawnhaas.xyz/og.png?v=5">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #C8102E; }

    .stripe-border {
      background: repeating-linear-gradient(
        180deg,
        #C8102E 0px, #C8102E 18px,
        #ffffff 18px, #ffffff 36px
      );
    }

    .popcorn-box {
      background: #ffffff;
      border-radius: 0 0 14px 14px;
      border: 3px solid #8B0000;
      border-top: none;
      clip-path: polygon(5% 0%, 95% 0%, 100% 100%, 0% 100%);
    }

    .slab { font-family: 'Alfa Slab One', serif; }

    .card {
      background: #ffffff;
      border-radius: 14px;
      border: 3px solid #8B0000;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card { position: relative; }
    .card-panel {
      background: #111;
      border-top: 1px solid #2a2a2a;
    }
    .card--compact .card-panel {
      max-height: 0;
      overflow: hidden;
      border-top: none;
      transition: max-height 0.32s ease, border-top 0s 0.32s;
    }
    .card--compact:hover .card-panel {
      max-height: 420px;
      border-top: 1px solid #2a2a2a;
      transition: max-height 0.32s ease;
    }
    .cd-backdrop-wrap {
      width: 100%; height: 130px; overflow: hidden; flex-shrink: 0;
      background: #1a1a1a;
    }
    @keyframes cd-shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .cd-backdrop-wrap.loading {
      background: linear-gradient(90deg, #1a1a1a 25%, #252525 50%, #1a1a1a 75%);
      background-size: 800px 100%;
      animation: cd-shimmer 1.4s infinite linear;
    }
    .cd-backdrop {
      width: 100%; height: 130px;
      object-fit: cover; display: block;
    }
    .cd-backdrop-fallback {
      width: 100%; height: 130px;
      background: linear-gradient(135deg, #8B0000, #C8102E);
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    .cd-body { padding: 10px 14px 14px; }
    .cd-tagline { font-size: 11px; color: #aaa; font-style: italic; margin-bottom: 6px; }
    .cd-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .cd-pill {
      font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: #2a2a2a; color: #ccc; font-weight: 600;
    }
    .cd-genre { background: #1e1e1e; color: #888; font-weight: 400; }
    .cd-overview { font-size: 12px; color: #bbb; line-height: 1.55; margin: 0; }

    #req-results:not(:empty) {
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border: 2px solid #8B0000;
      background: #fff;
    }
    #req-results .card:first-child { border-radius: 8px 8px 0 0; }
    #req-results .card:last-child  { border-radius: 0 0 8px 8px; }
    #req-results .card:only-child  { border-radius: 8px; }
    #req-results .card { border-left: none; border-right: none; border-top: none; border-radius: 0; }

    .card-accent {
      background: repeating-linear-gradient(
        90deg,
        #C8102E 0px, #C8102E 10px,
        #ffffff 10px, #ffffff 20px
      );
      height: 8px;
    }

    .rent-btn {
      background: #C8102E;
      color: #ffffff;
      font-family: 'Alfa Slab One', serif;
      border-radius: 8px;
      letter-spacing: 0.04em;
      transition: background 0.15s;
    }
    .rent-btn:hover { background: #8B0000; }

    @keyframes popcorn-pop {
      0%, 75%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      78%  { transform: translateY(-14px) scale(1.3) rotate(-8deg); }
      83%  { transform: translateY(4px)  scale(0.92) rotate(4deg); }
      88%  { transform: translateY(-6px) scale(1.1) rotate(-3deg); }
      93%  { transform: translateY(2px)  scale(0.97) rotate(1deg); }
    }
    .popcorn-pop {
      display: inline-block;
      animation: popcorn-pop 3s ease-in-out infinite;
      transform-origin: center bottom;
    }
    .popcorn-wrap {
      position: relative;
      display: inline-block;
    }
    @keyframes kernel-fly {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.6) rotate(0deg); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--kx)), calc(-50% + var(--ky))) scale(1) rotate(var(--kr)); }
    }
    .kernel-particle {
      position: absolute;
      left: 50%; top: 30%;
      width: 9px; height: 11px;
      border-radius: 50% 50% 40% 40% / 55% 55% 45% 45%;
      background: radial-gradient(ellipse at 35% 30%, #fffde7, #ffe082 70%, #ffc107);
      border: 1px solid #c8940a;
      pointer-events: none;
      animation: kernel-fly var(--kd) cubic-bezier(0.2, 0.8, 0.6, 1) forwards;
    }

    .kernel {
      display: inline-block;
      width: 8px; height: 8px;
      background: #FFD200;
      border-radius: 50%;
      margin: 0 2px;
    }

    .kern-o {
      display: inline-block;
      width: 0.52em;
      height: 0.64em;
      background: #FFD200;
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      border: 2.5px solid #c8940a;
      vertical-align: -0.04em;
      margin: 0 0.03em;
      box-shadow: inset 0 -2px 3px rgba(0,0,0,0.12);
    }

    .big-kernel {
      display: inline-block;
      width: 0.85em;
      height: 1em;
      background: radial-gradient(ellipse at 38% 38%, #fffde7, #ffe082 60%, #ffc107);
      border-radius: 42% 58% 38% 62% / 52% 44% 56% 48%;
      border: 2.5px solid #c8940a;
      vertical-align: -0.12em;
      margin-left: 0.12em;
      box-shadow:
        inset -2px -2px 5px rgba(0,0,0,0.10),
        inset 2px 2px 4px rgba(255,255,255,0.55);
      position: relative;
    }
    .big-kernel::before {
      content: '';
      position: absolute;
      top: 12%; left: 14%;
      width: 28%; height: 22%;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      transform: rotate(-20deg);
    }
  </style>
</head>
<body class="min-h-screen" style="font-family: 'Inter', sans-serif;">

  <!-- Header stripe top -->
  <div class="stripe-border h-10"></div>

  <!-- Header box -->
  <div style="background:#ffffff; border-bottom: 4px solid #8B0000;" class="px-6 py-6 text-center">
    <div class="text-5xl mb-1">
      <span class="popcorn-wrap" id="popcorn-wrap">
        <span class="popcorn-pop">🍿</span>
      </span>
    </div>
    <h1 class="slab text-4xl tracking-tight" style="color:#C8102E;">Popcorn Jawn</h1>
    <div class="flex items-center justify-center gap-2 mt-1">
      <span class="kernel"></span>
      <span class="text-xs font-semibold tracking-widest uppercase" style="color:#8B0000;">Now Showing · Fresh Downloads · Made with ❤️ in Philadelphia</span>
      <span class="kernel"></span>
    </div>
  </div>

  <!-- Request section -->
  <div class="max-w-2xl mx-auto px-4 pt-6 pb-2" style="position:relative;">
    <div class="flex items-center gap-3 mb-3">
      <span class="kernel"></span>
      <span class="text-xs font-bold tracking-widest uppercase" style="color:#ffffff;">Request a Movie</span>
      <span class="kernel"></span>
    </div>
    <div class="flex gap-2">
      <input type="text" id="req-input" placeholder="Title, description, vibe…"
             class="flex-1 px-4 py-2 rounded-lg text-sm"
             style="border:2px solid #8B0000; outline:none; font-family:'Inter',sans-serif;"
             oninput="debouncedSearch()"
             onkeydown="if(event.key==='Enter') searchMovies()"
             onblur="setTimeout(()=>{ document.getElementById('req-results').innerHTML=''; },200)">
      <button onclick="searchMovies()" class="rent-btn px-4 py-2 text-sm">Search</button>
    </div>
    <div id="req-results" style="position:absolute; left:1rem; right:1rem; top:100%; z-index:100; display:flex; flex-direction:column; gap:8px; max-height:70vh; overflow-y:auto; border-radius:10px; padding:0;"></div>
  </div>

  <!-- Content -->
  <div class="max-w-2xl mx-auto px-4 py-8">

    <div id="shares" class="space-y-4"></div>
    <div id="empty" class="hidden text-center py-16">
      <div class="text-4xl mb-3">🎞️</div>
      <p class="slab text-xl" style="color:#ffffff;">No showings tonight</p>
      <p class="text-sm mt-1" style="color:#ffaaaa;">Check back soon</p>
    </div>

    <!-- Expired -->
    <div id="history-section" class="mt-10 hidden">
      <div class="flex items-center gap-3 mb-4">
        <span class="kernel"></span>
        <span class="text-xs font-bold tracking-widest uppercase" style="color:#ffaaaa;">Past Showings</span>
        <span class="kernel"></span>
      </div>
      <div id="history"></div>
    </div>
  </div>

  <!-- Footer stripe top -->
  <div class="stripe-border h-6"></div>

  <!-- Footer band -->
  <div style="background:#ffffff; border-top:3px solid #8B0000; border-bottom:3px solid #8B0000;" class="text-center py-3">
    <span style="font-family:'Alfa Slab One',serif; font-size:1.1rem; color:#009A44; letter-spacing:0.06em;">🦅 Go Birds</span>
  </div>

  <!-- Footer stripe bottom -->
  <div class="stripe-border h-6"></div>

  <script>
    function daysUntil(iso) {
      return Math.ceil((new Date(iso) - new Date()) / 86400000);
    }

    function expiryBadge(iso) {
      const d = daysUntil(iso);
      if (d <= 0) return '<span class="text-xs font-bold" style="color:#ef4444;">Expired</span>';
      if (d <= 2) return `<span class="text-xs font-bold" style="color:#ef4444;">⚠ ${d}d left</span>`;
      if (d <= 5) return `<span class="text-xs font-bold" style="color:#d97706;">${d} days left</span>`;
      return `<span class="text-xs font-semibold" style="color:#16a34a;">${d} days left</span>`;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function posterImg(path, size) {
      return path
        ? `<img src="https://image.tmdb.org/t/p/w92${path}" class="${size} object-cover rounded flex-shrink-0" style="border:1px solid #d1d5db;" loading="lazy">`
        : `<div class="${size} flex-shrink-0 rounded flex items-center justify-center text-xl" style="background:#FFF0F0; border:1px solid #C8102E;">🎬</div>`;
    }

    function activeCard(s) {
      return `
        <div class="card" ${s.tmdbId ? `data-result-id="${s.tmdbId}" data-type="movie"` : ''}>
          <div class="card-accent"></div>
          <div class="p-4 flex items-center gap-4">
            ${posterImg(s.posterPath, 'w-12 h-16')}
            <div class="flex-1 min-w-0">
              <div class="slab text-lg leading-tight" style="color:#1a1a1a;">${s.title}</div>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                <span class="text-xs font-semibold px-1.5 py-0.5 rounded-full" style="background:#FFF0F0;color:#C8102E;">${s.year}</span>
                <span class="rating-slot text-xs" style="color:#aaa;">…</span>
              </div>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                <span class="text-xs" style="color:#666;">${s.size_human}</span>
                <span class="text-xs" style="color:#bbb;">·</span>
                <span class="text-xs" style="color:#666;">Added ${formatDate(s.created)}</span>
                <span class="text-xs" style="color:#bbb;">·</span>
                ${expiryBadge(s.expires)}
              </div>
            </div>
            <a href="${s.gofile_link}" target="_blank" class="rent-btn flex-shrink-0 text-sm px-4 py-2 no-underline">
              Get It
            </a>
          </div>
          ${s.tmdbId ? `<div class="card-panel"><div class="cd-backdrop-wrap loading"></div><div class="cd-body"></div></div>` : ''}
        </div>`;
    }

    function expiredRow(s) {
      return `
        <div class="flex items-center py-2 border-b" style="border-color:#ffaaaa33;">
          <span class="text-sm font-semibold" style="color:#ffaaaa;">${s.title} <span style="font-weight:400;">(${s.year})</span></span>
          <span class="ml-auto text-xs" style="color:#ff666680;">Expired ${formatDate(s.expires)}</span>
        </div>`;
    }

    async function load() {
      try {
        const data = await fetch('shares.json?t=' + Date.now()).then(r => r.json());
        const shares = data.shares || [];
        const active = shares.filter(s => daysUntil(s.expires) > 0).reverse();
        const expired = shares.filter(s => daysUntil(s.expires) <= 0).reverse();

        if (active.length === 0) {
          document.getElementById('empty').classList.remove('hidden');
        } else {
          document.getElementById('shares').innerHTML = active.map(activeCard).join('');
          fetchRatings(active.filter(s => s.tmdbId).map(s => ({id: s.tmdbId, mediaType: 'movie'})), document.getElementById('shares'));
        }
        if (expired.length > 0) {
          document.getElementById('history-section').classList.remove('hidden');
          document.getElementById('history').innerHTML = expired.map(expiredRow).join('');
        }
      } catch {
        document.getElementById('shares').innerHTML = '<p class="text-sm font-bold" style="color:#ffaaaa;">Failed to load shares.</p>';
      }
    }

    load();

    // Popcorn kernel burst
    const wrap = document.getElementById('popcorn-wrap');
    function spawnKernels() {
      const count = 5 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const k = document.createElement('span');
          k.className = 'kernel-particle';
          const angle = (Math.random() * 160 - 80) * Math.PI / 180;
          const dist = 45 + Math.random() * 45;
          k.style.setProperty('--kx', (Math.sin(angle) * dist) + 'px');
          k.style.setProperty('--ky', (-Math.cos(angle) * dist - 20) + 'px');
          k.style.setProperty('--kr', (Math.random() * 360 - 180) + 'deg');
          k.style.setProperty('--kd', (0.6 + Math.random() * 0.4) + 's');
          wrap.appendChild(k);
          setTimeout(() => k.remove(), 1100);
        }, i * 40);
      }
    }
    // Fire at 78% of the 3s animation cycle = 2340ms, then every 3s
    setTimeout(() => { spawnKernels(); setInterval(spawnKernels, 3000); }, 2340);

    // --- Movie request ---
    let searchTimer = null;
    function debouncedSearch() {
      clearTimeout(searchTimer);
      const q = document.getElementById('req-input').value.trim();
      if (q.length < 2) { document.getElementById('req-results').innerHTML = ''; return; }
      searchTimer = setTimeout(searchMovies, 350);
    }

    const STATUS_LABEL = {
      0: null,
      1: ['Unknown', '#999'],
      2: ['Pending', '#d97706'],
      3: ['Downloading', '#2563eb'],
      4: ['Partly Available', '#16a34a'],
      5: ['Available', '#16a34a'],
    };

    async function searchMovies() {
      const q = document.getElementById('req-input').value.trim();
      if (!q) return;
      const box = document.getElementById('req-results');
      box.innerHTML = '<p class="text-sm" style="color:#ffcccc;">Searching…</p>';
      try {
        const data = await fetch('/arr-control/seerr/search?q=' + encodeURIComponent(q)).then(r => r.json());
        if (!data.ok || !data.results.length) {
          box.innerHTML = '<p class="text-sm" style="color:#ffcccc;">No results found.</p>';
          return;
        }
        box.innerHTML = data.results.map(r => {
          const sl = STATUS_LABEL[r.status];
          const badge = sl
            ? `<span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:#fff4; color:${sl[1]};">${sl[0]}</span>`
            : '';
          const btn = (r.status === 5 || r.status === 4)
            ? `<span class="text-xs font-semibold px-3 py-1.5 rounded-lg" style="background:#16a34a20; color:#16a34a;">In Library</span>`
            : `<button onclick="requestMovie(${r.id},'${r.mediaType}',this)" class="rent-btn flex-shrink-0 text-xs px-3 py-1.5">+ Request</button>`;
          return `
            <div class="card card--compact" data-result-id="${r.id}" data-type="${r.mediaType}">
              <div class="card-accent"></div>
              <div class="p-4 flex items-center gap-4">
                ${posterImg(r.posterPath, 'w-12 h-16')}
                <div class="flex-1 min-w-0">
                  <div class="slab text-base leading-tight truncate" style="color:#1a1a1a;">${r.title}</div>
                  <div class="flex items-center flex-wrap gap-2 mt-0.5">
                    ${r.year ? `<span class="text-xs font-semibold px-1.5 py-0.5 rounded-full" style="background:#FFF0F0;color:#C8102E;">${r.year}</span>` : ''}
                    <span class="text-xs capitalize" style="color:#888;">${r.mediaType}</span>
                    ${badge}
                    <span class="rating-slot text-xs" style="color:#aaa;">…</span>
                  </div>
                </div>
                ${btn}
              </div>
              <div class="card-panel"><div class="cd-backdrop-wrap loading"></div><div class="cd-body"></div></div>
            </div>`;
        }).join('');
        fetchRatings(data.results, document.getElementById('req-results'));
      } catch {
        box.innerHTML = '<p class="text-sm" style="color:#ffcccc;">Search failed.</p>';
      }
    }

    async function fetchRatings(items, scope = document) {
      await Promise.all(items.map(async item => {
        const id = item.id || item.tmdbId;
        const type = item.mediaType || 'movie';
        if (!id) return;
        const card = scope.querySelector(`[data-result-id="${id}"]`);
        if (!card) return;
        const slot = card.querySelector('.rating-slot');
        if (!slot) return;
        try {
          const d = await fetch(`/arr-control/seerr/details?id=${id}&type=${type}`).then(x => x.json());
          if (!d.ok) { slot.textContent = ''; return; }
          // Fill pre-rendered panel skeleton (space already reserved, no layout shift)
          let panel = card.querySelector('.card-panel');
          if (!panel) { panel = document.createElement('div'); panel.className = 'card-panel'; card.appendChild(panel); }
          let metaHtml = '';
          if (d.runtime) metaHtml += `<span class="cd-pill">${d.runtime}m</span>`;
          if (d.rtScore) {
            const p = parseInt(d.rtScore);
            metaHtml += `<span class="cd-pill" style="color:${p>=60?'#ef4444':'#888'}">${p>=60?'🍅':'🤢'} ${d.rtScore}</span>`;
          }
          if (d.imdbScore) metaHtml += `<span class="cd-pill" style="color:#f5c518">★ ${d.imdbScore}</span>`;
          (d.genres||[]).forEach(g => { metaHtml += `<span class="cd-pill cd-genre">${g}</span>`; });
          const overview = (d.overview||'').length > 280 ? d.overview.slice(0,280)+'…' : (d.overview||'');
          const wrap = panel.querySelector('.cd-backdrop-wrap');
          if (wrap) {
            wrap.classList.remove('loading');
            wrap.innerHTML = d.backdropPath
              ? `<img class="cd-backdrop" src="https://image.tmdb.org/t/p/w780${d.backdropPath}" loading="eager">`
              : `<div class="cd-backdrop-fallback">🎬</div>`;
          } else {
            panel.innerHTML = `<div class="cd-backdrop-wrap">${d.backdropPath
              ? `<img class="cd-backdrop" src="https://image.tmdb.org/t/p/w780${d.backdropPath}" loading="eager">`
              : `<div class="cd-backdrop-fallback">🎬</div>`}</div>`;
          }
          const body = panel.querySelector('.cd-body') || (() => { const b = document.createElement('div'); b.className = 'cd-body'; panel.appendChild(b); return b; })();
          body.innerHTML = `${d.tagline ? `<div class="cd-tagline">${d.tagline}</div>` : ''}
            ${metaHtml ? `<div class="cd-meta">${metaHtml}</div>` : ''}
            ${overview ? `<p class="cd-overview">${overview}</p>` : ''}`;
          let html = '';
          if (d.rtScore) {
            const pct = parseInt(d.rtScore);
            const tomato = pct >= 60 ? '🍅' : '🤢';
            html += `<span style="color:${pct>=60?'#C8102E':'#888'}; font-weight:600;">${tomato} ${d.rtScore}</span>`;
          }
          if (d.imdbScore) {
            html += `${html ? ' · ' : ''}<span style="color:#f5c518; font-weight:600;">IMDb ${d.imdbScore}</span>`;
          }
          if (!html && d.voteAverage) {
            html = `<span style="color:#f59e0b; font-weight:600;">⭐ ${d.voteAverage.toFixed(1)}</span>`;
          }
          slot.innerHTML = html || '';
        } catch { slot.textContent = ''; }
      }));
    }

    async function requestMovie(id, type, btn) {
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const res = await fetch('/arr-control/seerr/request', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({mediaId: id, mediaType: type}),
        });
        if (res.ok) {
          btn.textContent = 'Queued 🍿';
          btn.style.background = '#16a34a';
        } else {
          const d = await res.json();
          btn.textContent = 'Error';
          btn.disabled = false;
          console.error(d);
        }
      } catch {
        btn.textContent = 'Error';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
