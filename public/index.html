<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghoulish Jawn</title>
  <meta property="og:title" content="Ghoulish Jawn">
  <meta property="og:description" content="Fresh frights, ready to watch. Made with love in Philadelphia.">
  <meta property="og:image" content="https://popcorn.jawnhaas.xyz/og-halloween.png?v=1792843232">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:url" content="https://popcorn.jawnhaas.xyz">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://popcorn.jawnhaas.xyz/og-halloween.png?v=1792843232">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0208;
      --glow-top: #3d0800;
      --glow-bottom: #1a0a2e;
      --accent: #f97316;
      --accent-dark: #c2410c;
      --accent-light: #fdba74;
      --header-bg: #1a0a00;
      --stripe-a: #f97316;
      --stripe-b: #1a0a00;
      --card-border: #c2410c;
      --footer-bg: #ffffff;
      --footer-border: #c2410c;
      --footer-text: #009A44;
    }
    html, body { overflow-x: hidden; }
    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 50% 0%, var(--glow-top) 0%, transparent 65%),
        radial-gradient(ellipse at 90% 100%, var(--glow-bottom) 0%, transparent 60%);
    }

    .stripe-border {
      background: repeating-linear-gradient(
        180deg,
        var(--stripe-a) 0px, var(--stripe-a) 18px,
        var(--stripe-b) 18px, var(--stripe-b) 36px
      );
    }

    .popcorn-box {
      background: #ffffff;
      border-radius: 0 0 14px 14px;
      border: 3px solid #c2410c;
      border-top: none;
      clip-path: polygon(5% 0%, 95% 0%, 100% 100%, 0% 100%);
    }

    .slab { font-family: 'Alfa Slab One', serif; }

    .card {
      background: #ffffff;
      border-radius: 14px;
      border: 3px solid var(--card-border);
      overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(249,115,22,0.22); }

    .card { position: relative; }
    .card-panel {
      background: #111;
      border-top: 1px solid #2a2a2a;
    }
    .card--compact .card-panel {
      max-height: 0;
      overflow: hidden;
      border-top: none;
      transition: max-height 0.32s ease, border-top 0s 0.32s;
    }
    .card--compact:hover .card-panel,
    .card--compact.is-expanded .card-panel {
      max-height: 420px;
      border-top: 1px solid #2a2a2a;
      transition: max-height 0.32s ease;
    }
    .cd-backdrop-wrap {
      width: 100%; height: 130px; overflow: hidden; flex-shrink: 0;
      background: #1a1a1a;
    }
    @keyframes cd-shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .cd-backdrop-wrap.loading {
      background: linear-gradient(90deg, #1a1a1a 25%, #252525 50%, #1a1a1a 75%);
      background-size: 800px 100%;
      animation: cd-shimmer 1.4s infinite linear;
    }
    .cd-backdrop {
      width: 100%; height: 130px;
      object-fit: cover; display: block;
    }
    .cd-backdrop-fallback {
      width: 100%; height: 130px;
      background: linear-gradient(135deg, #7c2d12, var(--accent));
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    .cd-body { padding: 10px 14px 14px; }
    .cd-tagline { font-size: 11px; color: #aaa; font-style: italic; margin-bottom: 6px; }
    .cd-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .cd-pill {
      font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: #2a2a2a; color: #ccc; font-weight: 600;
    }
    .cd-genre { background: #1e1e1e; color: #888; font-weight: 400; }
    .cd-overview { font-size: 12px; color: #bbb; line-height: 1.55; margin: 0; }

    .card-pending {
      opacity: 0.55;
      filter: grayscale(0.4);
      border-color: #aaa;
    }
    .card-pending .card-accent {
      background: repeating-linear-gradient(
        90deg, #aaa 0px, #aaa 10px, #fff 10px, #fff 20px
      );
    }

    #req-results:not(:empty) {
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border: 2px solid var(--accent-dark);
      border-radius: 10px;
      overflow: hidden;
      box-sizing: border-box;
    }
    #req-results .card { border: none; border-bottom: 1px solid #f0e0e0; border-radius: 0; overflow: hidden; }
    #req-results .card:first-child { border-radius: 8px 8px 0 0; }
    #req-results .card:last-child  { border-radius: 0 0 8px 8px; border-bottom: none; }
    #req-results .card:only-child  { border-radius: 8px; border-bottom: none; }
    #req-results .card .card-accent { display: none; }

    .card-accent {
      background: repeating-linear-gradient(
        90deg,
        var(--accent) 0px, var(--accent) 10px,
        #ffffff 10px, #ffffff 20px
      );
      height: 8px;
    }

    .rent-btn {
      background: var(--accent);
      color: #ffffff;
      font-family: 'Alfa Slab One', serif;
      border-radius: 8px;
      letter-spacing: 0.04em;
      transition: background 0.15s, transform 0.1s;
    }
    .rent-btn:hover { background: var(--accent-dark); transform: scale(1.04); }

    @keyframes popcorn-pop {
      0%, 75%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      78%  { transform: translateY(-14px) scale(1.3) rotate(-8deg); }
      83%  { transform: translateY(4px)  scale(0.92) rotate(4deg); }
      88%  { transform: translateY(-6px) scale(1.1) rotate(-3deg); }
      93%  { transform: translateY(2px)  scale(0.97) rotate(1deg); }
    }
    .popcorn-pop {
      display: inline-block;
      animation: popcorn-pop 3s ease-in-out infinite;
      transform-origin: center bottom;
    }
    .popcorn-wrap {
      position: relative;
      display: inline-block;
    }
    @keyframes kernel-fly {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.6) rotate(0deg); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--kx)), calc(-50% + var(--ky))) scale(1) rotate(var(--kr)); }
    }
    .kernel-particle {
      position: absolute;
      left: 50%; top: 30%;
      width: 9px; height: 11px;
      border-radius: 50% 50% 40% 40% / 55% 55% 45% 45%;
      background: radial-gradient(ellipse at 35% 30%, #fffde7, #ffe082 70%, #ffc107);
      border: 1px solid #c8940a;
      pointer-events: none;
      animation: kernel-fly var(--kd) cubic-bezier(0.2, 0.8, 0.6, 1) forwards;
    }

    .kernel {
      display: inline-block;
      width: 8px; height: 8px;
      background: #FFD200;
      border-radius: 50%;
      margin: 0 2px;
    }

    .kern-o {
      display: inline-block;
      width: 0.52em;
      height: 0.64em;
      background: #FFD200;
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      border: 2.5px solid #c8940a;
      vertical-align: -0.04em;
      margin: 0 0.03em;
      box-shadow: inset 0 -2px 3px rgba(0,0,0,0.12);
    }

    .big-kernel {
      display: inline-block;
      width: 0.85em;
      height: 1em;
      background: radial-gradient(ellipse at 38% 38%, #fffde7, #ffe082 60%, #ffc107);
      border-radius: 42% 58% 38% 62% / 52% 44% 56% 48%;
      border: 2.5px solid #c8940a;
      vertical-align: -0.12em;
      margin-left: 0.12em;
      box-shadow:
        inset -2px -2px 5px rgba(0,0,0,0.10),
        inset 2px 2px 4px rgba(255,255,255,0.55);
      position: relative;
    }
    .big-kernel::before {
      content: '';
      position: absolute;
      top: 12%; left: 14%;
      width: 28%; height: 22%;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    @keyframes spook-fly {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(1.2) rotate(var(--sr)); }
    }
    .spook-particle {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      z-index: 9999;
      animation: spook-fly var(--sd) cubic-bezier(0.15, 0.8, 0.5, 1) forwards;
    }

    @keyframes bat-float {
      0%   { transform: translateY(0) scaleX(1); }
      40%  { transform: translateY(-12px) scaleX(-1); }
      80%  { transform: translateY(4px) scaleX(1); }
      100% { transform: translateY(0) scaleX(1); }
    }
    .bat {
      display: inline-block;
      font-size: 1.3rem;
      animation: bat-float var(--bd) ease-in-out infinite;
      animation-delay: var(--bdelay);
      opacity: 0.85;
    }
  </style>
</head>
<body class="min-h-screen" style="font-family: 'Inter', sans-serif;">

  <!-- Menu overlay -->
  <div id="menu-overlay" onclick="closeMenu()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;"></div>

  <!-- Activity drawer -->
  <div id="menu-drawer" style="display:none;position:fixed;right:0;top:0;bottom:0;width:min(340px,100vw);background:#fff;z-index:201;overflow-y:auto;box-shadow:-6px 0 32px rgba(0,0,0,0.25);transition:transform 0.2s;">
    <div style="background:var(--accent);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1;">
      <span class="slab" style="color:#fff;font-size:1.1rem;">Activity</span>
      <button onclick="closeMenu()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1;padding:0 4px;">×</button>
    </div>
    <div style="padding:18px 20px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:12px;">📥 Downloads</div>
      <div id="menu-dl">Loading…</div>
    </div>
    <div style="border-top:2px solid #FFF0F0;padding:18px 20px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:12px;">📺 TV Episodes</div>
      <div id="menu-tv"></div>
    </div>
    <div style="border-top:2px solid #FFF0F0;padding:18px 20px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:12px;">📤 Now Sharing</div>
      <div id="menu-ul"></div>
    </div>
  </div>

  <!-- Header box -->
  <div id="header-box" style="background:var(--header-bg);position:relative;border-bottom:2px solid var(--accent);" class="px-6 py-6 text-center">
    <button onclick="toggleMenu()" id="menu-btn" title="Activity" style="position:absolute;top:18px;right:18px;background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:5px;">
      <span style="display:block;width:22px;height:2px;background:var(--accent);border-radius:2px;"></span>
      <span style="display:block;width:22px;height:2px;background:var(--accent);border-radius:2px;"></span>
      <span style="display:block;width:22px;height:2px;background:var(--accent);border-radius:2px;"></span>
    </button>
    <div class="text-5xl mb-1">
      <span class="popcorn-wrap" id="popcorn-wrap">
        <span class="popcorn-pop" id="header-emoji">🍿</span>
      </span>
    </div>
    <h1 class="slab text-4xl tracking-tight" id="site-title" style="color:var(--accent);">Ghoulish Jawn</h1>
    <div class="flex items-center justify-center gap-2 mt-1">
      <span id="tagline-emoji-left" style="font-size:0.8rem;">🎃</span>
      <span id="tagline-text" class="text-xs font-semibold tracking-widest uppercase" style="color:var(--accent-light);">Now Showing · Fresh Downloads · Made with 🧡 in Philadelphia</span>
      <span id="tagline-emoji-right" style="font-size:0.8rem;">🎃</span>
    </div>
  </div>

  <!-- Request section -->
  <div class="max-w-2xl mx-auto px-4 pt-6 pb-2" style="position:relative;">
    <div class="flex items-center gap-3 mb-3">
      <span id="summon-emoji-left" style="font-size:0.85rem;">🕯️</span>
      <span id="summon-label" class="text-xs font-bold tracking-widest uppercase" style="color:var(--accent-light);">Summon Something</span>
      <span id="summon-emoji-right" style="font-size:0.85rem;">🕯️</span>
    </div>
    <div class="flex gap-2">
      <input type="text" id="req-input" placeholder="Title, description, vibe…"
             class="flex-1 px-4 py-2 rounded-lg text-sm"
             style="border:2px solid var(--accent-dark); outline:none; font-family:'Inter',sans-serif; font-size:16px;"
             oninput="debouncedSearch()"
             onkeydown="if(event.key==='Enter') searchMovies()"
             onblur="setTimeout(()=>{ document.getElementById('req-results').innerHTML=''; },200)">
      <button onclick="searchMovies()" class="rent-btn px-4 py-2 text-sm">Search</button>
    </div>
    <div id="req-results" style="position:absolute; left:1rem; right:1rem; top:100%; z-index:100; display:flex; flex-direction:column; gap:0; border-radius:10px; padding:0;"></div>
  </div>

  <!-- Content -->
  <div class="max-w-2xl mx-auto px-4 py-8">

    <div id="season-picker" class="mb-4"></div>
    <div id="pending" class="space-y-4 mb-4"></div>
    <div id="shares" class="space-y-4"></div>
    <div id="empty" class="hidden text-center py-16">
      <div id="empty-emoji" class="text-5xl mb-3" style="display:inline-block;">👻</div>
      <p id="empty-title" class="slab text-xl" style="color:#ffffff;">Nothing haunting the queue tonight</p>
      <p id="empty-sub" class="text-sm mt-1" style="color:var(--accent-light);">Request something spooky</p>
    </div>

  </div>

  <!-- Footer band -->
  <div id="footer-band" style="background:var(--footer-bg); border-top:2px solid var(--footer-border); border-bottom:2px solid var(--footer-border);" class="text-center py-3">
    <span id="footer-text" style="font-family:'Alfa Slab One',serif; font-size:1.1rem; color:var(--footer-text); letter-spacing:0.06em;">🦅 Go Birds! 🎃</span>
  </div>

  <script>
    // Touch tap to expand compact search cards on mobile
    document.addEventListener('click', function(e) {
      const card = e.target.closest('.card--compact');
      if (!card) return;
      if (e.target.closest('button, a')) return;
      card.classList.toggle('is-expanded');
    });

    function daysUntil(iso) {
      return Math.ceil((new Date(iso) - new Date()) / 86400000);
    }

    function expiryBadge(iso) {
      const d = daysUntil(iso);
      if (d <= 0) return '<span class="text-xs font-bold" style="color:#ef4444;">Expired</span>';
      if (d <= 2) return `<span class="text-xs font-bold" style="color:#ef4444;">⚠ ${d}d left</span>`;
      if (d <= 5) return `<span class="text-xs font-bold" style="color:#d97706;">${d} days left</span>`;
      return `<span class="text-xs font-semibold" style="color:#16a34a;">${d} days left</span>`;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function posterImg(path, size) {
      const src = path
        ? (path.startsWith('http') ? path : `https://image.tmdb.org/t/p/w92${path}`)
        : null;
      return src
        ? `<img src="${src}" class="${size} object-cover rounded flex-shrink-0" style="border:1px solid #d1d5db;" loading="lazy">`
        : `<div class="${size} flex-shrink-0 rounded flex items-center justify-center text-xl" style="background:#fff7ed; border:1px solid var(--accent);">🎬</div>`;
    }
    function epLabel(s) {
      return `S${String(s.season).padStart(2,'0')}E${String(s.episode).padStart(2,'0')}`;
    }

    function activeCard(s) {
      const isTV = s.media_type === 'tv';
      const badge = isTV ? epLabel(s) : s.year;
      return `
        <div class="card" ${s.tmdbId ? `data-result-id="${s.tmdbId}" data-type="movie"` : ''}>
          <div class="card-accent"></div>
          <div class="p-4 flex items-center gap-4">
            ${posterImg(s.posterPath, 'w-12 h-16')}
            <div class="flex-1 min-w-0">
              <div class="slab text-lg leading-tight" style="color:#1a1a1a;">${s.title}</div>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                <span class="text-xs font-semibold px-1.5 py-0.5 rounded-full" style="background:#fff7ed;color:var(--accent);">${badge}</span>
                ${isTV && s.episode_title ? `<span class="text-xs" style="color:#666;">${s.episode_title}</span>` : '<span class="rating-slot text-xs" style="color:#aaa;">…</span>'}
              </div>
              ${isTV && s.episode_overview ? `<div class="text-xs mt-1" style="color:#888;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${s.episode_overview}</div>` : ''}
              <div class="flex flex-wrap items-center gap-2 mt-1">
                <span class="text-xs" style="color:#666;">${s.size_human}</span>
                <span class="text-xs" style="color:#bbb;">·</span>
                <span class="text-xs" style="color:#666;">Added ${formatDate(s.created)}</span>
                <span class="text-xs" style="color:#bbb;">·</span>
                ${expiryBadge(s.expires)}
              </div>
            </div>
            <div class="flex flex-col gap-2 flex-shrink-0">
              <a href="${s.gofile_link}" target="_blank" class="rent-btn flex-shrink-0 text-sm px-4 py-2 no-underline text-center">
                Get It
              </a>
              <button onclick="deleteShare(this,event,'${s.radarr_movie_id||''}','${s.radarr_history_id||''}','${s.sonarr_history_id||''}','${(s.title||'').replace(/'/g,'')}',${s.year||'null'})" title="Delete file" style="background:none;border:1px solid #e5e7eb;border-radius:6px;color:#ccc;font-size:0.85rem;padding:3px 8px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor='#ef4444';this.style.color='#ef4444';" onmouseout="this.style.borderColor='#e5e7eb';this.style.color='#ccc';">🗑</button>
            </div>
          </div>
          ${!isTV && s.tmdbId ? `<div class="card-panel"><div class="cd-backdrop-wrap loading"></div><div class="cd-body"></div></div>` : ''}
        </div>`;
    }


    async function dismissPending(id) {
      await fetch(`/arr-control/pending?id=${id}`, {method: 'DELETE'}).catch(() => {});
      document.querySelector(`[data-pending-id="${id}"]`)?.remove();
    }

    async function renderPendingCards(activeShares) {
      const activeTmdbIds = new Set((activeShares||[]).map(s => String(s.tmdbId)));
      let pending = [];
      try {
        pending = await fetch('/arr-control/pending').then(r => r.json());
      } catch { pending = []; }
      // Auto-dismiss any that are now active
      const toRemove = pending.filter(p => activeTmdbIds.has(String(p.id)));
      toRemove.forEach(p => fetch(`/arr-control/pending?id=${p.id}`, {method: 'DELETE'}).catch(() => {}));
      pending = pending.filter(p => !activeTmdbIds.has(String(p.id)));
      const el = document.getElementById('pending');
      el.innerHTML = pending.map(p => `
        <div class="card card-pending" data-pending-id="${p.id}">
          <div class="card-accent"></div>
          <div class="p-4 flex items-center gap-4">
            ${posterImg(p.posterPath, 'w-12 h-16')}
            <div class="flex-1 min-w-0">
              <div class="slab text-lg leading-tight" style="color:#555;">${p.title}</div>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                ${p.year ? `<span class="text-xs font-semibold px-1.5 py-0.5 rounded-full" style="background:#f0f0f0;color:#888;">${p.year}</span>` : ''}
                <span class="text-xs font-semibold" style="color:#999;">⏳ Requested${p.seasonLabel ? ' · ' + p.seasonLabel : ''} — waiting for download</span>
              </div>
            </div>
            <button onclick="dismissPending(${p.id})" title="Dismiss" style="color:#bbb;font-size:1.2rem;line-height:1;background:none;border:none;cursor:pointer;padding:4px 8px;" onmouseover="this.style.color='#888'" onmouseout="this.style.color='#bbb'">×</button>
          </div>
        </div>`).join('');
    }

    async function load() {
      try {
        const data = await fetch('shares.json?t=' + Date.now()).then(r => r.json());
        const shares = data.shares || [];
        const active = shares.filter(s => daysUntil(s.expires) > 0).reverse();
        _activeShares = active;

        renderPendingCards(active);

        if (active.length === 0) {
          document.getElementById('empty').classList.remove('hidden');
        } else {
          document.getElementById('shares').innerHTML = active.map(activeCard).join('');
          fetchRatings(active.filter(s => s.tmdbId).map(s => ({id: s.tmdbId, mediaType: 'movie'})), document.getElementById('shares'));
        }
      } catch {
        document.getElementById('shares').innerHTML = '<p class="text-sm font-bold" style="color:#ffaaaa;">Failed to load shares.</p>';
      }
    }

    load();

    function spawnSpooks(x, y) {
      const emojis = (THEMES[_activeTheme] || THEMES.halloween).deleteParticles;
      const count = 14;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const p = document.createElement('span');
          p.className = 'spook-particle';
          const angle = (Math.random() * 360) * Math.PI / 180;
          const dist = 80 + Math.random() * 160;
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          p.style.setProperty('--sx', (Math.cos(angle) * dist) + 'px');
          p.style.setProperty('--sy', (Math.sin(angle) * dist) + 'px');

    // Viewport bats
    function startBats() {
      let stopped = false;
      window._floaterStop = () => { stopped = true; };
      function launchBat() {
        if (stopped) return;
        const t = THEMES[_activeTheme] || THEMES.halloween;
        const floatEmojis = t.floater === 'bats' ? ['🦇','👻'] : ['🦇','👻'];
        const bat = document.createElement('span');
        bat.textContent = floatEmojis[Math.floor(Math.random() * floatEmojis.length)];
        bat.style.cssText = 'position:fixed;pointer-events:none;z-index:9;font-size:1.4rem;will-change:transform;transition:none;';
        const edge = Math.floor(Math.random() * 4);
        const W = window.innerWidth, H = window.innerHeight;
        let x, y, tx, ty;
        if (edge === 0) { x = -30; y = Math.random()*H; tx = W+30; ty = Math.random()*H; }
        else if (edge === 1) { x = W+30; y = Math.random()*H; tx = -30; ty = Math.random()*H; }
        else if (edge === 2) { x = Math.random()*W; y = -30; tx = Math.random()*W; ty = H+30; }
        else { x = Math.random()*W; y = H+30; tx = Math.random()*W; ty = -30; }
        bat.style.left = x + 'px';
        bat.style.top  = y + 'px';
        if (tx < x) bat.style.transform = 'scaleX(-1)';
        document.body.appendChild(bat);
        const dur = 4000 + Math.random() * 5000;
        const start = performance.now();
        function frame(now) {
          if (stopped) { bat.remove(); return; }
          const t = Math.min((now - start) / dur, 1);
          const perp = Math.sin(t * Math.PI * 4) * 18;
          const dx = tx - x, dy = ty - y;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy/len, ny = dx/len;
          const cx = x + dx*t + nx*perp;
          const cy = y + dy*t + ny*perp;
          bat.style.left = cx + 'px';
          bat.style.top  = cy + 'px';
          if (t < 1) requestAnimationFrame(frame);
          else bat.remove();
        }
        requestAnimationFrame(frame);
        setTimeout(launchBat, 1200 + Math.random() * 2800);
      }
      for (let i = 0; i < 3; i++) setTimeout(launchBat, i * 600);
    }

      const emojis = ['🎃','🎃','🎃','👻','🕷️'];
      const count = 5 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {

          k.style.cssText = 'position:absolute;left:50%;top:30%;pointer-events:none;font-size:2rem;';
          const angle = (Math.random() * 160 - 80) * Math.PI / 180;
          const dist = 45 + Math.random() * 55;
          const tx = Math.sin(angle) * dist;
          const ty = -Math.cos(angle) * dist - 20;
          const rot = (Math.random() * 360 - 180);
          const dur = 0.65 + Math.random() * 0.4;
          k.animate([
            { transform: 'translate(-50%,-50%) scale(0.5) rotate(0deg)', opacity: 1 },
            { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.1) rotate(${rot}deg)`, opacity: 0 }
          ], { duration: dur * 1000, easing: 'cubic-bezier(0.2,0.8,0.6,1)', fill: 'forwards' });
          wrap.appendChild(k);
          setTimeout(() => k.remove(), dur * 1000 + 100);
        }, i * 40);

    async function fetchRatings(items, scope = document) {
      await Promise.all(items.map(async item => {
        const id = item.id || item.tmdbId;
        const type = item.mediaType || 'movie';
        if (!id) return;
        const card = scope.querySelector(`[data-result-id="${id}"]`);
        if (!card) return;
        const slot = card.querySelector('.rating-slot');
        if (!slot) return;
        try {
          const d = await fetch(`/arr-control/seerr/details?id=${id}&type=${type}`).then(x => x.json());
          if (!d.ok) { slot.textContent = ''; return; }
          // Fill pre-rendered panel skeleton (space already reserved, no layout shift)
          let panel = card.querySelector('.card-panel');
          if (!panel) { panel = document.createElement('div'); panel.className = 'card-panel'; card.appendChild(panel); }
          let metaHtml = '';
          if (d.runtime) metaHtml += `<span class="cd-pill">${d.runtime}m</span>`;
          if (d.rtScore) {
            const p = parseInt(d.rtScore);
            metaHtml += `<span class="cd-pill" style="color:${p>=60?'#ef4444':'#888'}">${p>=60?'🍅':'🤢'} ${d.rtScore}</span>`;
          }
          if (d.imdbScore) metaHtml += `<span class="cd-pill" style="color:#f5c518">★ ${d.imdbScore}</span>`;
          (d.genres||[]).forEach(g => { metaHtml += `<span class="cd-pill cd-genre">${g}</span>`; });
          const overview = (d.overview||'').length > 280 ? d.overview.slice(0,280)+'…' : (d.overview||'');
          const wrap = panel.querySelector('.cd-backdrop-wrap');
          if (wrap) {
            wrap.classList.remove('loading');
            wrap.innerHTML = d.backdropPath
              ? `<img class="cd-backdrop" src="https://image.tmdb.org/t/p/w780${d.backdropPath}" loading="eager">`
              : `<div class="cd-backdrop-fallback">🎬</div>`;
          } else {
            panel.innerHTML = `<div class="cd-backdrop-wrap">${d.backdropPath
              ? `<img class="cd-backdrop" src="https://image.tmdb.org/t/p/w780${d.backdropPath}" loading="eager">`
              : `<div class="cd-backdrop-fallback">🎬</div>`}</div>`;
          }
          const body = panel.querySelector('.cd-body') || (() => { const b = document.createElement('div'); b.className = 'cd-body'; panel.appendChild(b); return b; })();
          body.innerHTML = `${d.tagline ? `<div class="cd-tagline">${d.tagline}</div>` : ''}
            ${metaHtml ? `<div class="cd-meta">${metaHtml}</div>` : ''}
            ${overview ? `<p class="cd-overview">${overview}</p>` : ''}`;
          let html = '';
          if (d.rtScore) {
            const pct = parseInt(d.rtScore);
            const tomato = pct >= 60 ? '🍅' : '🤢';
            html += `<span style="color:${pct>=60?'#f97316':'#888'}; font-weight:600;">${tomato} ${d.rtScore}</span>`;
          }
          if (d.imdbScore) {
            html += `${html ? ' · ' : ''}<span style="color:#f5c518; font-weight:600;">IMDb ${d.imdbScore}</span>`;
          }
          if (!html && d.voteAverage) {
            html = `<span style="color:#f59e0b; font-weight:600;">⭐ ${d.voteAverage.toFixed(1)}</span>`;
          }
          slot.innerHTML = html || '';
        } catch { slot.textContent = ''; }
      }));
    }

      const seasons = seasonDivs

        if (!t.range) continue;
        const [[sm, sd], [em, ed]] = t.range;
        if (sm > em) { // year-wrap (Dec–Jan)
          if ((m === sm && d >= sd) || m > sm || m < em || (m === em && d <= ed)) return key;
        } else {
          if ((m > sm || (m === sm && d >= sd)) && (m < em || (m === em && d <= ed))) return key;
        }
      }
      return 'default';
    }

    function applyTheme(key) {
      const t = THEMES[key] || THEMES.default;
      _activeTheme = key;
      const root = document.documentElement;
      for (const [k, v] of Object.entries(t.css)) root.style.setProperty(k, v);
      const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      setText('site-title', t.title);
      setText('header-emoji', t.headerEmoji);
      setText('tagline-emoji-left', t.taglineEmojiL);
      setText('tagline-text', t.tagline);
      setText('tagline-emoji-right', t.taglineEmojiR);
      setText('summon-emoji-left', t.summonEmojiL);
      setText('summon-label', t.summonLabel);
      setText('summon-emoji-right', t.summonEmojiR);
      setText('empty-emoji', t.emptyEmoji);
      setText('empty-title', t.emptyTitle);
      setText('empty-sub', t.emptySub);
      setText('past-emoji-left', t.pastEmojiL);
      setText('past-label', t.pastLabel);
      setText('past-emoji-right', t.pastEmojiR);
      setText('footer-text', t.footerText);
      const ft = document.getElementById('footer-text');
      if (ft) ft.style.color = t.footerTextColor;
      if (window._floaterStop) { window._floaterStop(); window._floaterStop = null; }
      if (t.floater === 'bats') startBats();
      else if (t.floater === 'leaves') startLeaves();
      else if (t.floater === 'snow') startSnow();
    }

    function startLeaves() {
      const emojis = ['🍂','🍁','🍂','🍁','🌿'];
      let stopped = false;
      window._floaterStop = () => { stopped = true; };
      function spawnLeaf() {
        if (stopped) return;
        const el = document.createElement('span');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const startX = Math.random() * window.innerWidth;
        el.style.cssText = `position:fixed;pointer-events:none;z-index:1;font-size:${1+Math.random()}rem;left:${startX}px;top:-30px;opacity:0.7;`;
        document.body.appendChild(el);
        const dur = 4000 + Math.random() * 4000;
        const drift = (Math.random() - 0.5) * 200;
        el.animate([
          { transform: `translate(0,0) rotate(0deg)`, opacity: 0.7 },
          { transform: `translate(${drift}px,${window.innerHeight+40}px) rotate(${(Math.random()-0.5)*360}deg)`, opacity: 0 }
        ], { duration: dur, easing: 'linear', fill: 'forwards' });
        setTimeout(() => el.remove(), dur + 100);
        setTimeout(spawnLeaf, 600 + Math.random() * 800);
      }
      spawnLeaf();
    }

    function startSnow() {
      let stopped = false;
      window._floaterStop = () => { stopped = true; };
      function spawnFlake() {
        if (stopped) return;
        const el = document.createElement('span');
        el.textContent = '❄️';
        const size = 0.7 + Math.random() * 0.8;
        el.style.cssText = `position:fixed;pointer-events:none;z-index:1;font-size:${size}rem;left:${Math.random()*window.innerWidth}px;top:-20px;opacity:0.6;`;
        document.body.appendChild(el);
        const dur = 5000 + Math.random() * 5000;
        const drift = (Math.random() - 0.5) * 100;
        el.animate([
          { transform: `translate(0,0)`, opacity: 0.6 },
          { transform: `translate(${drift}px,${window.innerHeight+30}px)`, opacity: 0 }
        ], { duration: dur, easing: 'linear', fill: 'forwards' });
        setTimeout(() => el.remove(), dur + 100);
        setTimeout(spawnFlake, 300 + Math.random() * 500);
      }
      spawnFlake();
    }

    // Apply theme before load so colors are right immediately
    applyTheme(detectTheme());

    // --- Activity drawer ---
    let _menuOpen = false, _menuTimer = null, _activeShares = [];

    function toggleMenu() { _menuOpen ? closeMenu() : openMenu(); }

    function openMenu() {
      _menuOpen = true;
      document.getElementById('menu-overlay').style.display = 'block';
      document.getElementById('menu-drawer').style.display = 'block';
      populateUploads();
      loadMenuDownloads();
      _menuTimer = setInterval(loadMenuDownloads, 12000);
    }

    function closeMenu() {
      _menuOpen = false;
      document.getElementById('menu-overlay').style.display = 'none';
      document.getElementById('menu-drawer').style.display = 'none';
      clearInterval(_menuTimer);
    }

    function populateUploads() {
      const el = document.getElementById('menu-ul');
      if (!_activeShares.length) { el.innerHTML = '<p style="color:#aaa;font-size:12px;">Nothing sharing right now.</p>'; return; }
      el.innerHTML = _activeShares.map(s => {
        const isTV = s.media_type === 'tv';
        const ep = isTV ? epLabel(s) : null;
        const metaLine = isTV
          ? `${ep}${s.episode_title ? ' · ' + s.episode_title : ''} · ${s.size_human} · ${expiryBadge(s.expires).replace(/<[^>]+>/g,'')}`
          : `${s.year} · ${s.size_human} · ${expiryBadge(s.expires).replace(/<[^>]+>/g,'')}`;
        const posterSrc = s.posterPath
          ? (s.posterPath.startsWith('http') ? s.posterPath : `https://image.tmdb.org/t/p/w92${s.posterPath}`)
          : null;
        const posterEl = posterSrc
          ? `<img src="${posterSrc}" style="width:28px;height:38px;object-fit:cover;border-radius:3px;flex-shrink:0;">`
          : `<div style="width:28px;height:38px;background:#FFF0F0;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">🎬</div>`;
        return `
          <a href="${s.gofile_link}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #FFF0F0;text-decoration:none;color:inherit;">
            ${posterEl}
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.title}</div>
              <div style="font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${metaLine}</div>
              ${isTV && s.episode_overview ? `<div style="font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.episode_overview}</div>` : ''}
            </div>
            <span style="font-size:16px;flex-shrink:0;">↓</span>
          </a>`;
      }).join('');
    }

    async function loadMenuDownloads() {
      const el = document.getElementById('menu-dl');
      try {
        const d = await fetch('/arr-control/downloads').then(r => r.json());
        if (!d.ok) { el.innerHTML = '<span style="color:#f87171;font-size:12px;">Unavailable</span>'; return; }
        let html = '';
        if (d.paused) html += '<div style="color:#d97706;font-size:12px;font-weight:600;margin-bottom:8px;">⏸ Queue paused</div>';
        else if (d.active.length && d.speed !== '0') html += `<div style="color:#16a34a;font-size:11px;margin-bottom:8px;">↓ ${(+d.speed/1024).toFixed(1)} MB/s</div>`;
        if (!d.active.length) {
          html += '<p style="color:#aaa;font-size:12px;">No active downloads</p>';
        } else {
          html += d.active.map(s => `
            <div style="margin-bottom:12px;">
              <div style="font-size:12px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;" title="${s.name}">${s.name}</div>
              <div style="background:#f0e0e0;border-radius:4px;height:5px;">
                <div style="background:#f97316;height:5px;border-radius:4px;width:${s.pct}%;transition:width .5s;"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:3px;">
                <span>${s.pct}%</span><span>${d.paused ? '—' : s.eta}</span>
              </div>
            </div>`).join('');
        }
        if (d.recent.length) {
          html += '<div style="margin-top:4px;padding-top:12px;border-top:1px solid #f5f5f5;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ccc;margin-bottom:8px;">Recent</div>';
          html += d.recent.map(s => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #fafafa;">
              <span style="font-size:12px;color:#666;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.name}</span>
              <span style="font-size:11px;font-weight:600;flex-shrink:0;margin-left:8px;color:${s.status==='Completed'?'#16a34a':'#aaa'};">${s.status}</span>
            </div>`).join('');
        }
        el.innerHTML = html;

        // TV section
        const tvEl = document.getElementById('menu-tv');
        if (tvEl) {
          let tvHtml = '';
          if (d.tv_queue?.length) {
            tvHtml += '<div style="margin-bottom:10px;">';
            tvHtml += d.tv_queue.map(e => `
              <div style="margin-bottom:10px;">
                <div style="font-size:12px;font-weight:600;color:#333;">${e.show}</div>
                <div style="font-size:11px;color:#888;margin-bottom:3px;">S${String(e.season).padStart(2,'0')}E${String(e.episode).padStart(2,'0')}</div>
                <div style="background:#f0e0e0;border-radius:4px;height:5px;">
                  <div style="background:#f97316;height:5px;border-radius:4px;width:${e.pct}%;transition:width .5s;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:3px;">
                  <span>${e.pct}%</span><span>${e.eta || ''}</span>
                </div>
              </div>`).join('');
            tvHtml += '</div>';
          }
          if (d.tv_recent?.length) {
            if (d.tv_queue?.length) tvHtml += '<div style="border-top:1px solid #f5f5f5;margin-bottom:8px;padding-top:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ccc;">Recent</div>';
            tvHtml += d.tv_recent.map(e => `
              <a href="${e.gofile_link || 'https://jellyfin.jawnhaas.xyz/web/#/search?query=' + encodeURIComponent(e.show)}" target="_blank" style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #fafafa;text-decoration:none;color:inherit;">
                <span style="font-size:12px;font-weight:600;color:#555;flex-shrink:0;">${e.show}</span>
                <span style="font-size:11px;color:#bbb;flex-shrink:0;">S${String(e.season).padStart(2,'0')}E${String(e.episode).padStart(2,'0')}</span>
                <span style="font-size:11px;color:#ddd;margin-left:auto;flex-shrink:0;">${e.date}</span>
                ${e.gofile_link ? '<span style="font-size:13px;flex-shrink:0;margin-left:2px;">↓</span>' : ''}
              </a>`).join('');
          }
          if (!tvHtml) tvHtml = '<p style="color:#aaa;font-size:12px;">No TV episodes yet.</p>';
          tvEl.innerHTML = tvHtml;
        }
      } catch { el.innerHTML = '<span style="color:#f87171;font-size:12px;">Error</span>'; }
    }

    async function requestMovie(id, type, btn) {
      btn.disabled = true;
      btn.textContent = '…';
      // Grab card info for the pending display
      const card = btn.closest('.card');
      const title = card?.querySelector('.slab')?.textContent?.trim() || '';
      const year = card?.querySelector('[style*="FFF0F0"]')?.textContent?.trim() || '';
      const posterImg = card?.querySelector('img')?.src?.match(/w92(.+)$/)?.[1] || null;
      try {
        const res = await fetch('/arr-control/seerr/request', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({mediaId: id, mediaType: type}),
        });
        if (res.ok) {
          btn.textContent = 'Summoned! 👻';
          btn.style.background = '#16a34a';
          const r = btn.getBoundingClientRect();
          spawnSpooks(r.left + r.width/2, r.top + r.height/2);
          await fetch('/arr-control/pending', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, type, title, year, posterPath: posterImg}),
          }).catch(() => {});
          renderPendingCards(_activeShares);
          // Close dropdown
          setTimeout(() => { document.getElementById('req-results').innerHTML = ''; document.getElementById('req-input').value = ''; }, 800);
        } else {
          const d = await res.json();
          btn.textContent = 'Error';
          btn.disabled = false;
          console.error(d);
        }
      } catch {
        btn.textContent = 'Error';
        btn.disabled = false;
      }
    }

    async function deleteShare(btn, e, radarrMovieId, radarrHistoryId, sonarrHistoryId, title, year) {
      e.stopPropagation();
      const isTV = !!sonarrHistoryId && !radarrMovieId;
      const label = title + (year ? ` (${year})` : '');
      const siteName = (THEMES[_activeTheme] || THEMES.halloween).title;
      const msg = `Delete "${label}" and remove the file from disk?`;
      if (!confirm(msg)) return;
      btn.textContent = '…';
      btn.disabled = true;
      const params = new URLSearchParams();
      if (radarrMovieId) params.set('radarr_movie_id', radarrMovieId);
      if (radarrHistoryId) params.set('radarr_history_id', radarrHistoryId);
      if (sonarrHistoryId) params.set('sonarr_history_id', sonarrHistoryId);
      try {
        const res = await fetch('/arr-control/shares/delete?' + params.toString());
        if (res.ok) {
          const card = btn.closest('.card');
          // Big poof from card center
          const cr = card.getBoundingClientRect();
          const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
          const poofEmojis = (THEMES[_activeTheme] || THEMES.halloween).deleteParticles;
          for (let i = 0; i < 28; i++) {
            setTimeout(() => {
              const p = document.createElement('span');
              p.textContent = poofEmojis[Math.floor(Math.random() * poofEmojis.length)];
              const size = 1.5 + Math.random() * 2.5;
              p.style.cssText = `position:fixed;pointer-events:none;z-index:9999;font-size:${size}rem;left:${cx}px;top:${cy}px;`;
              document.body.appendChild(p);
              const angle = (Math.random() * 360) * Math.PI / 180;
              const dist = 80 + Math.random() * 280;
              const dur = 500 + Math.random() * 600;
              p.animate([
                { transform: 'translate(-50%,-50%) scale(0.3) rotate(0deg)', opacity: 1 },
                { transform: `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1.4) rotate(${(Math.random()*720-360)}deg)`, opacity: 0 }
              ], { duration: dur, easing: 'cubic-bezier(0.1,0.8,0.4,1)', fill: 'forwards' });
              setTimeout(() => p.remove(), dur + 50);
            }, i * 25);
          }
          card.style.transition = 'opacity 0.4s, transform 0.4s';
          card.style.opacity = '0';
          card.style.transform = 'scale(0.85)';
          setTimeout(() => card.remove(), 400);
          // Remove from _activeShares and refresh hamburger
          _activeShares = _activeShares.filter(s => {
            if (radarrMovieId && String(s.radarr_movie_id) === String(radarrMovieId)) return false;
            if (radarrHistoryId && String(s.radarr_history_id) === String(radarrHistoryId)) return false;
            if (sonarrHistoryId && String(s.sonarr_history_id) === String(sonarrHistoryId)) return false;
            return true;
          });
          populateUploads();
        } else {
          btn.textContent = '🗑';
          btn.disabled = false;
          alert('Delete failed');
        }
      } catch {
        btn.textContent = '🗑';
        btn.disabled = false;
      }
    }
  </script>
</body>
