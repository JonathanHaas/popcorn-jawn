<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="36" height="630" patternTransform="rotate(0)">
      <rect width="18" height="630" fill="#C8102E"/>
      <rect x="18" width="18" height="630" fill="#ffffff"/>
    </pattern>
  </defs>

  <!-- Stripe left panel -->
  <rect width="180" height="630" fill="url(#stripes)"/>
  <!-- Stripe right panel -->
  <rect x="1020" width="180" height="630" fill="url(#stripes)"/>

  <!-- Main red background -->
  <rect x="180" width="840" height="630" fill="#C8102E"/>

  <!-- Top stripe bar -->
  <rect x="180" y="0" width="840" height="24" fill="#8B0000"/>
  <!-- Bottom stripe bar -->
  <rect x="180" y="606" width="840" height="24" fill="#8B0000"/>

  <!-- Center white card -->
  <rect x="240" y="120" width="720" height="390" rx="24" fill="#ffffff"/>
  <!-- Card top accent stripe -->
  <clipPath id="cardTop">
    <rect x="240" y="120" width="720" height="24" rx="12"/>
  </clipPath>
  <rect x="240" y="120" width="720" height="24" fill="#8B0000" clip-path="url(#cardTop)"/>

  <!-- Popcorn bucket (SVG shapes) -->
  <g transform="translate(554, 165)">
    <!-- bucket body (trapezoid) -->
    <polygon points="8,40 84,40 76,90 16,90" fill="#ffffff" stroke="#8B0000" stroke-width="3"/>
    <!-- red stripes on bucket -->
    <polygon points="24,40 34,40 28,90 18,90" fill="#C8102E"/>
    <polygon points="50,40 60,40 54,90 44,90" fill="#C8102E"/>
    <polygon points="76,40 84,40 72,90 62,90" fill="#C8102E"/>
    <!-- bucket rim -->
    <rect x="6" y="34" width="80" height="10" rx="4" fill="#8B0000"/>
    <!-- popcorn kernels -->
    <ellipse cx="26" cy="34" rx="14" ry="12" fill="#fffde7" stroke="#e0c040" stroke-width="2"/>
    <ellipse cx="46" cy="28" rx="15" ry="13" fill="#fffde7" stroke="#e0c040" stroke-width="2"/>
    <ellipse cx="66" cy="33" rx="13" ry="11" fill="#fffde7" stroke="#e0c040" stroke-width="2"/>
    <ellipse cx="36" cy="20" rx="12" ry="11" fill="#fffde7" stroke="#e0c040" stroke-width="2"/>
    <ellipse cx="57" cy="18" rx="12" ry="10" fill="#fffde7" stroke="#e0c040" stroke-width="2"/>
    <!-- highlight on kernels -->
    <ellipse cx="26" cy="30" rx="5" ry="4" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="46" cy="24" rx="6" ry="4" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="66" cy="29" rx="5" ry="4" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Popcorn Jawn title -->
  <text x="600" y="355" font-size="72" font-weight="900" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" fill="#C8102E" letter-spacing="-1">Popcorn Jawn</text>

  <!-- Tagline -->
  <text x="600" y="400" font-size="24" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" fill="#8B0000" font-weight="600" letter-spacing="3">FRESH DOWNLOADS · READY TO WATCH</text>

  <!-- Yellow kernel dots -->
  <circle cx="390" cy="430" r="6" fill="#FFD200"/>
  <circle cx="420" cy="430" r="6" fill="#FFD200"/>
  <circle cx="450" cy="430" r="6" fill="#FFD200"/>
  <circle cx="750" cy="430" r="6" fill="#FFD200"/>
  <circle cx="780" cy="430" r="6" fill="#FFD200"/>
  <circle cx="810" cy="430" r="6" fill="#FFD200"/>
</svg>
